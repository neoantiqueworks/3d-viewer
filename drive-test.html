<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The API key is restricted to HTTP referrers on this site, so the Drive
     request must carry at least the origin. Never use a policy that drops it. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive GLB Test</title>

<!--
  ===========================================================================
  STYLES
  Full-screen canvas behind a small control panel. The panel sits at the top,
  is limited in height so the model stays visible on phones, and can be
  collapsed with the Hide button.
  ===========================================================================
-->
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #9a9da1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }

  /* The 3D canvas fills the whole window; touch-action none lets
     OrbitControls handle all touch gestures instead of page scrolling. */
  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* Control panel */
  #panel {
    position: fixed;
    top: max(8px, env(safe-area-inset-top));
    left: 8px;
    right: 8px;
    max-width: 560px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.94);
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
    box-sizing: border-box;
  }
  #panelHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #panel.collapsed #panelBody { display: none; }
  #panelBody { margin-top: 8px; }

  #panel label.field {
    display: block;
    margin-bottom: 6px;
    color: #333;
  }
  #panel input[type="text"],
  #panel input[type="password"] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin-top: 2px;
    padding: 8px;
    font-size: 16px; /* 16px prevents iOS Safari from zooming on focus */
    border: 1px solid #bbb;
    border-radius: 6px;
  }
  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin: 6px 0;
  }
  .row .spacer { flex: 1; }
  button {
    font-size: 15px;
    padding: 8px 14px;
    border: 1px solid #999;
    border-radius: 6px;
    background: #f2f2f2;
    color: #222;
  }
  button.primary {
    background: #2b6cb0;
    border-color: #2b6cb0;
    color: #fff;
    font-weight: 600;
  }
  button:disabled { opacity: 0.5; }
  #togglePanel { padding: 4px 10px; font-size: 13px; }

  /* Status log: monospace, scrollable, one line per event */
  #log {
    max-height: 32vh;
    overflow-y: auto;
    background: #1e1e1e;
    color: #ddd;
    font-family: Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.4;
    padding: 6px 8px;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #log .ok  { color: #8fdc8f; }
  #log .err { color: #ff8080; }
  #log .ts  { color: #888; }
</style>

<!--
  ===========================================================================
  IMPORT MAP
  Maps "three" and "three/addons/" to one pinned three.js version on jsDelivr.
  Loading from a CORS-enabled CDN is what lets this page run from file://.
  ===========================================================================
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- 3D view -->
<canvas id="view"></canvas>

<!-- Control panel: inputs, buttons and status log -->
<div id="panel">
  <div id="panelHeader">
    <strong>Drive GLB Test</strong>
    <button id="togglePanel" type="button">Hide</button>
  </div>
  <div id="panelBody">
    <label class="field">API key
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" autocapitalize="off">
    </label>
    <label class="field">Drive file ID (or full share link)
      <input id="fileId" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
    </label>
    <div class="row">
      <label><input id="rememberKey" type="checkbox" checked> Remember key in this browser</label>
      <span class="spacer"></span>
      <button id="forgetKey" type="button">Forget</button>
    </div>
    <div class="row">
      <button id="loadBtn" class="primary" type="button">Load</button>
      <button id="clearLog" type="button">Clear log</button>
    </div>
    <div id="log"></div>
  </div>
</div>

<!--
  ===========================================================================
  STARTUP WATCHDOG (classic script)
  Runs before the module script. If three.js cannot be loaded from the CDN
  (offline, blocked), the module never starts and nothing else could report
  it, so this writes a message to the on-screen log after a timeout. It also
  shows uncaught script errors in the log.
  ===========================================================================
-->
<script>
  (function () {
    function earlyLog(text) {
      var line = document.createElement('div');
      line.className = 'err';
      line.textContent = text;
      document.getElementById('log').appendChild(line);
    }
    window.addEventListener('error', function (e) {
      earlyLog('Script error: ' + (e.message || e) +
        (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
    });
    setTimeout(function () {
      if (!window.__driveTestReady) {
        earlyLog('three.js did not load from cdn.jsdelivr.net within 15 s. ' +
          'Check the internet connection, then reload the page.');
      }
    }, 15000);
  })();
</script>

<!--
  ===========================================================================
  MAIN SCRIPT (ES module)
  ===========================================================================
-->
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

  // -------------------------------------------------------------------------
  // CONFIG
  // DEBUG: when true, everything in the on-screen log is mirrored to the
  // browser console and error stacks are shown. When false, nothing is
  // written to the console.
  // -------------------------------------------------------------------------
  const DEBUG = false;

  const THREE_VERSION = '0.186.1';
  const DRIVE_FILES_URL = 'https://www.googleapis.com/drive/v3/files/';
  const DRACO_DECODER_PATH =
    'https://cdn.jsdelivr.net/npm/three@' + THREE_VERSION + '/examples/jsm/libs/draco/gltf/';

  // localStorage keys (browser only, never part of the repository)
  const STORE_KEY = 'driveTest.apiKey';
  const STORE_FILE = 'driveTest.fileId';
  const STORE_REMEMBER = 'driveTest.remember';

  // -------------------------------------------------------------------------
  // STATUS LOG
  // log() appends a timestamped line to the on-screen log and returns the
  // line element so it can be updated in place (used for download progress).
  // Levels: 'info' (default), 'ok', 'err'.
  // -------------------------------------------------------------------------
  const logEl = document.getElementById('log');

  function timestamp() {
    const d = new Date();
    const pad = (n, w) => String(n).padStart(w, '0');
    return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' +
      pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
  }

  function log(text, level = 'info') {
    text = redactKeys(text);
    const line = document.createElement('div');
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = timestamp() + ' ';
    const msg = document.createElement('span');
    if (level !== 'info') msg.className = level;
    msg.textContent = text;
    line.appendChild(ts);
    line.appendChild(msg);
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;

    if (DEBUG) {
      if (level === 'err') console.error(text);
      else console.log(text);
    }
    return msg;
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(2) + ' MB';
  }

  // Shortens the key for display in the log: first 4 and last 4 characters.
  function maskKey(key) {
    if (key.length <= 8) return '****';
    return key.slice(0, 4) + '...' + key.slice(-4);
  }

  // The full key never reaches the log. Google's error bodies echo the key
  // back, so every line is passed through this: the typed key is masked, and
  // so is anything else shaped like a Google API key.
  function redactKeys(text) {
    let out = String(text);
    const input = document.getElementById('apiKey');
    const key = input ? input.value.trim() : '';
    if (key.length > 8) out = out.split(key).join(maskKey(key));
    return out.replace(/AIza[0-9A-Za-z_-]{35}/g, (match) => maskKey(match));
  }

  // Error that has already been written to the log, so the caller does not
  // log it a second time.
  class LoggedError extends Error {}

  // -------------------------------------------------------------------------
  // UI WIRING
  // Inputs, buttons, remembered values and the collapsible panel.
  // -------------------------------------------------------------------------
  const apiKeyInput = document.getElementById('apiKey');
  const fileIdInput = document.getElementById('fileId');
  const rememberBox = document.getElementById('rememberKey');
  const loadBtn = document.getElementById('loadBtn');
  const panel = document.getElementById('panel');
  const toggleBtn = document.getElementById('togglePanel');

  // localStorage can throw (private mode, blocked storage); never let it
  // break the page.
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
  function storeDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  // Restore saved values. A ?model=FILE_ID URL parameter wins over the
  // saved file ID.
  rememberBox.checked = storeGet(STORE_REMEMBER) !== '0';
  apiKeyInput.value = storeGet(STORE_KEY) || '';
  const urlModel = new URLSearchParams(location.search).get('model');
  fileIdInput.value = urlModel || storeGet(STORE_FILE) || '';

  rememberBox.addEventListener('change', () => {
    storeSet(STORE_REMEMBER, rememberBox.checked ? '1' : '0');
    if (!rememberBox.checked) storeDel(STORE_KEY);
  });

  document.getElementById('forgetKey').addEventListener('click', () => {
    storeDel(STORE_KEY);
    apiKeyInput.value = '';
    log('Saved API key removed from this browser.');
  });

  document.getElementById('clearLog').addEventListener('click', () => {
    logEl.textContent = '';
  });

  toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
    toggleBtn.textContent = panel.classList.contains('collapsed') ? 'Show' : 'Hide';
  });

  loadBtn.addEventListener('click', onLoadClicked);
  [apiKeyInput, fileIdInput].forEach((el) => {
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter') onLoadClicked(); });
  });

  // Accepts a bare file ID or any common Drive link form:
  //   https://drive.google.com/file/d/FILE_ID/view?usp=sharing
  //   https://drive.google.com/open?id=FILE_ID
  function extractFileId(input) {
    const s = input.trim();
    let m = s.match(/\/d\/([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    m = s.match(/[?&]id=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    return s;
  }

  // -------------------------------------------------------------------------
  // SCENE SETUP
  // Renderer, camera, orbit controls, lights, resize handling, render loop.
  // -------------------------------------------------------------------------
  const canvas = document.getElementById('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9a9da1);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(3, 2, 3);
  scene.add(camera); // camera is in the scene so the key light can ride on it

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // Lighting: soft sky/ground fill, a key light that follows the camera so
  // the visible side is always lit, and a fixed rim light from behind.
  scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 1.6));
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
  keyLight.position.set(1, 1.5, 1);
  camera.add(keyLight);
  const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
  rimLight.position.set(-2, 1, -3);
  scene.add(rimLight);

  // Neutral default material applied to every mesh of the loaded model.
  const DEFAULT_MATERIAL = new THREE.MeshStandardMaterial({
    color: 0xd0d0d0,
    metalness: 0.0,
    roughness: 0.6,
    side: THREE.DoubleSide
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });

  // -------------------------------------------------------------------------
  // GLTF LOADER
  // Draco and Meshopt decoders are attached so compressed GLB exports also
  // load. The Draco decoder is fetched from the CDN only when needed.
  // -------------------------------------------------------------------------
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath(DRACO_DECODER_PATH);
  const gltfLoader = new GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);
  gltfLoader.setMeshoptDecoder(MeshoptDecoder);

  // -------------------------------------------------------------------------
  // DRIVE FETCH
  // Downloads the file bytes with Drive API v3 files.get (alt=media) and
  // logs every step. Throws LoggedError on any failure.
  // -------------------------------------------------------------------------

  // One-line hint for the most common Google API errors.
  function hintFor(status, body) {
    if (/API_KEY_INVALID|API key not valid/i.test(body)) {
      return 'The API key is not valid. Copy it again from Google Cloud Console > APIs & Services > Credentials.';
    }
    if (/SERVICE_DISABLED|accessNotConfigured|has not been used in project/i.test(body)) {
      return 'The Google Drive API is not enabled for the key\'s project. Enable it in APIs & Services > Library, wait a minute, retry.';
    }
    if (/API_KEY_HTTP_REFERRER_BLOCKED|referer/i.test(body)) {
      return 'The key has HTTP referrer restrictions that block this page. Remove them or add this page\'s address.';
    }
    if (/API_KEY_SERVICE_BLOCKED/i.test(body)) {
      return 'The key has API restrictions that do not include the Google Drive API.';
    }
    if (/cannotDownloadAbusiveFile/i.test(body)) {
      return 'Drive flagged this file and blocks downloads of it.';
    }
    if (status === 404) {
      return 'File not found. Check the file ID and that the file is shared as "Anyone with the link".';
    }
    if (status === 403) {
      return 'Access denied. Check that the file is shared as "Anyone with the link" and that downloads are not restricted.';
    }
    if (status === 400) return 'Bad request. Check the file ID and the API key.';
    if (status === 429) return 'Rate limit reached. Wait a moment and retry.';
    return '';
  }

  async function fetchDriveFile(fileId, apiKey) {
    const query = '?alt=media&supportsAllDrives=true&key=';
    const url = DRIVE_FILES_URL + encodeURIComponent(fileId) + query + encodeURIComponent(apiKey);
    log('Request sent: GET ' + DRIVE_FILES_URL + encodeURIComponent(fileId) + query + maskKey(apiKey));

    // Network stage. A TypeError here means the request never produced a
    // readable response: offline, DNS failure or a CORS rejection.
    let response;
    const t0 = performance.now();
    try {
      // Explicit, so the origin the key's referrer restriction checks is sent.
      response = await fetch(url, { referrerPolicy: 'strict-origin-when-cross-origin' });
    } catch (err) {
      log('Request failed: ' + err.name + ': ' + err.message, 'err');
      log('No HTTP response is readable. This is a network or CORS failure; the browser hides the reason from the page. ' +
        'The browser console (F12) shows the exact reason.', 'err');
      throw new LoggedError(err.message);
    }

    // Status and headers
    log('HTTP ' + response.status + ' ' + (response.statusText || ''), response.ok ? 'ok' : 'err');
    log('Content-Type: ' + (response.headers.get('content-type') || '(not provided)'));
    const total = Number(response.headers.get('content-length')) || 0;
    log('Content-Length: ' + (total ? total + ' bytes (' + formatBytes(total) + ')' : '(not provided)'));

    // Error responses: print the full body text Google returned
    if (!response.ok) {
      let body;
      try { body = await response.text(); } catch (e) { body = '(could not read body: ' + e.message + ')'; }
      log('Response body:\n' + body, 'err');
      const hint = hintFor(response.status, body);
      if (hint) log('Hint: ' + hint, 'err');
      throw new LoggedError('HTTP ' + response.status);
    }

    // Body download with progress. A single log line is updated in place.
    let bytes;
    if (response.body && response.body.getReader) {
      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      let lastUpdate = 0;
      const progressLine = log('Receiving: 0 B');
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        const now = performance.now();
        if (now - lastUpdate > 150) {
          lastUpdate = now;
          progressLine.textContent = 'Receiving: ' + formatBytes(received) +
            (total ? ' (' + Math.min(100, Math.round(received / total * 100)) + '%)' : '');
        }
      }
      bytes = new Uint8Array(received);
      let offset = 0;
      for (const c of chunks) { bytes.set(c, offset); offset += c.length; }
      progressLine.textContent = 'Receiving: done';
    } else {
      bytes = new Uint8Array(await response.arrayBuffer());
    }
    const seconds = ((performance.now() - t0) / 1000).toFixed(2);
    log('Bytes received: ' + bytes.length + ' (' + formatBytes(bytes.length) + ') in ' + seconds + ' s', 'ok');
    return bytes;
  }

  // -------------------------------------------------------------------------
  // FORMAT CHECK
  // A binary glTF starts with the ASCII magic "glTF". Anything else (an HTML
  // page, a JSON error, a different file type) is reported with a preview.
  // -------------------------------------------------------------------------
  function checkGlbMagic(bytes) {
    const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
    if (magic === 'glTF') {
      const version = new DataView(bytes.buffer).getUint32(4, true);
      log('Format check: GLB, glTF version ' + version, 'ok');
      return;
    }
    const preview = new TextDecoder().decode(bytes.slice(0, 200)).replace(/[^\x20-\x7E\n]/g, '.');
    log('Format check failed: the file does not start with "glTF", so it is not a GLB.', 'err');
    log('First bytes as text:\n' + preview, 'err');
    throw new LoggedError('Not a GLB');
  }

  // -------------------------------------------------------------------------
  // PARSE AND DISPLAY
  // Parses the GLB, replaces all materials with the neutral default, centers
  // the model at the origin and frames the camera on it.
  // -------------------------------------------------------------------------
  let currentModel = null;

  // Frees GPU memory of the previous model. The shared default material is
  // kept.
  function disposeModel(root) {
    root.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
    });
  }

  async function parseGlb(bytes) {
    log('Parsing GLB...');
    let gltf;
    try {
      gltf = await gltfLoader.parseAsync(bytes.buffer, '');
    } catch (err) {
      log('Parse failed: ' + (err && err.message ? err.message : String(err)), 'err');
      if (DEBUG && err && err.stack) log(err.stack, 'err');
      throw new LoggedError('Parse failed');
    }
    return gltf.scene;
  }

  function showModel(root) {
    if (currentModel) {
      scene.remove(currentModel);
      disposeModel(currentModel);
      currentModel = null;
    }

    // Material override and statistics
    let meshCount = 0;
    let triCount = 0;
    root.traverse((o) => {
      if (!o.isMesh) return;
      meshCount++;
      const g = o.geometry;
      if (!g.attributes.normal) g.computeVertexNormals();
      triCount += (g.index ? g.index.count : g.attributes.position.count) / 3;
      const old = Array.isArray(o.material) ? o.material : [o.material];
      old.forEach((m) => { if (m && m !== DEFAULT_MATERIAL) m.dispose(); });
      o.material = DEFAULT_MATERIAL;
    });

    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    if (box.isEmpty()) {
      log('Parse result: no visible geometry in the file (' + meshCount + ' meshes).', 'err');
      throw new LoggedError('Empty model');
    }
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    log('Parse result: meshes: ' + meshCount + ', triangles: ' + Math.round(triCount).toLocaleString('en-US'), 'ok');
    log('Bounding box size (glTF units, meters): ' +
      size.x.toFixed(3) + ' x ' + size.y.toFixed(3) + ' x ' + size.z.toFixed(3));

    // Center the model on the origin
    root.position.sub(center);
    scene.add(root);
    currentModel = root;

    // Frame the camera so the bounding sphere fits the view, seen from a
    // three-quarter angle slightly above.
    const radius = Math.max(size.length() / 2, 1e-6);
    const fovRad = THREE.MathUtils.degToRad(camera.fov);
    const fitFov = camera.aspect < 1 ? 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect) : fovRad;
    const distance = (radius / Math.sin(fitFov / 2)) * 1.1;
    const dir = new THREE.Vector3(1, 0.6, 1).normalize();
    camera.position.copy(dir.multiplyScalar(distance));
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.updateProjectionMatrix();
    controls.target.set(0, 0, 0);
    controls.minDistance = radius * 0.05;
    controls.maxDistance = distance * 10;
    controls.update();
    log('Model displayed. Drag to rotate, pinch or scroll to zoom, two fingers or right drag to pan.', 'ok');
  }

  // -------------------------------------------------------------------------
  // LOAD FLOW
  // Validates inputs, remembers values, then fetch -> check -> parse ->
  // display. Every stage logs its own errors; unexpected errors are caught
  // here.
  // -------------------------------------------------------------------------
  async function onLoadClicked() {
    if (loadBtn.disabled) return;
    const apiKey = apiKeyInput.value.trim();
    const fileId = extractFileId(fileIdInput.value);

    if (!apiKey) { log('Enter an API key first.', 'err'); return; }
    if (!fileId) { log('Enter a Drive file ID first.', 'err'); return; }
    if (fileId !== fileIdInput.value.trim()) {
      fileIdInput.value = fileId;
      log('Extracted file ID from link: ' + fileId);
    }

    if (rememberBox.checked) storeSet(STORE_KEY, apiKey);
    storeSet(STORE_FILE, fileId);

    loadBtn.disabled = true;
    log('--- Load started ---');
    try {
      const bytes = await fetchDriveFile(fileId, apiKey);
      checkGlbMagic(bytes);
      const root = await parseGlb(bytes);
      showModel(root);
    } catch (err) {
      if (!(err instanceof LoggedError)) {
        log('Unexpected error: ' + (err && err.message ? err.message : String(err)), 'err');
        if (DEBUG && err && err.stack) log(err.stack, 'err');
      }
      log('--- Load failed ---', 'err');
    } finally {
      loadBtn.disabled = false;
    }
  }

  // -------------------------------------------------------------------------
  // STARTUP
  // Marks the page as ready for the watchdog and logs the environment.
  // -------------------------------------------------------------------------
  window.__driveTestReady = true;
  log('Page ready. three.js ' + THREE_VERSION + ' (r' + THREE.REVISION + ') loaded. Opened via ' + location.protocol + '//');
  if (apiKeyInput.value) log('Using saved API key ' + maskKey(apiKeyInput.value) + '.');
</script>
</body>
</html>
