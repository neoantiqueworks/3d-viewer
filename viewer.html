<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The Drive API key is restricted to HTTP referrers on this site, so the
     Drive request must carry at least the origin. strict-origin-when-cross-origin
     sends the origin to googleapis.com over https. Never use a policy that drops it. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- user-scalable=no stops double-tap page zoom so all gestures reach the canvas.
     viewport-fit=cover lets the layout use the full screen on notched phones. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- Tints the browser UI to match the top of the gradient. Kept in sync with
     CONFIG.background by applyBackground(). -->
<meta name="theme-color" content="#15161a">
<!-- Declaring both schemes tells the browser this page handles light and dark
     itself. Without it, Android Chrome's Auto Dark Theme rewrites the page's
     CSS colors when the phone is in dark mode: it inverts lightness while
     keeping hue, which turns the light beige background into a dark brown.
     This page already has its own light and dark backgrounds, so the automatic
     treatment must be switched off. -->
<meta name="color-scheme" content="only light">
<title>3D Viewer</title>

<!--
  ===========================================================================
  One viewer, no UI framework. An earlier build layered Fluent UI Web
  Components on top of this, but once every control had to be painted into a
  canvas to survive Samsung Internet's forced dark mode, Fluent's surfaces
  (which live in shadow DOM styled by CSS tokens, and cannot be painted into
  from the page) stopped contributing anything visible. On the device the two
  builds were indistinguishable, so the framework and its two CDN modules were
  removed and this file is the single viewer.
  ===========================================================================
-->

<!--
  ===========================================================================
  STYLES
  One full-screen canvas with a transparent UI layer on top. The UI layer
  itself ignores touches; only the round buttons inside it receive them, so
  the whole screen stays usable for orbit and pinch.

  Button colors come from two body classes, .bg-light and .bg-dark, so the
  icons stay readable on both backgrounds.
  ===========================================================================
-->
<style>
  /* ---- Layout tokens -------------------------------------------------- */
  :root {
    /* "only light" is the strongest opt out available. It is not enough on its
       own: Samsung Internet force-darkens CSS colours regardless, which is why
       every coloured control is painted on canvas instead. Kept as a guard for
       the browsers that do honour it. */
    color-scheme: only light;

    /* Everything scales with viewport width so the bars stay clear of each
       other on a 320 px phone and stop growing on a wide one. The vw terms are
       what make the three material buttons, the center button and Share fit in
       one row at every width from 320 to 480 px, portrait. */
    --gap: clamp(8px, 3vw, 14px);                    /* edge margin */
    --btn: clamp(42px, 12.5vw, 52px);                /* icon button size */
    --swatch: clamp(38px, 11.5vw, 46px);             /* material swatch size */
    --group-gap: clamp(6px, 2.5vw, 10px);            /* between buttons in a group */
    /* Safe areas keep the buttons clear of the notch and the home bar. */
    --edge-top:    calc(env(safe-area-inset-top, 0px) + var(--gap));
    --edge-bottom: calc(env(safe-area-inset-bottom, 0px) + var(--gap));
    --edge-left:   calc(env(safe-area-inset-left, 0px) + var(--gap));
    --edge-right:  calc(env(safe-area-inset-right, 0px) + var(--gap));

    /* The two gradient stops of the active background. applyBackground() keeps
       these in sync with CONFIG.background, so the overlay screens and the
       very first paint match what the canvas renders.

       The values here are the DARK preset, because the default material is
       chrome and chrome's default background is dark. Matching the pre-script
       state to the common case avoids a flash from light to dark while
       three.js is still loading. */
    --bg-top: #15161a;
    --bg-bottom: #0d0e11;
  }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* The 3D canvas fills the window. touch-action none hands every gesture
     to OrbitControls instead of scrolling the page. */
  #view {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }

  /* ---- UI layer ------------------------------------------------------- */
  /* Sits above the overlays (z-index 20) so Close stays reachable on the error
     card. #ui creates its own stacking context, so a z-index on a button
     inside it could never lift that button over an overlay on its own; the
     layer as a whole has to be above them. Which buttons are appropriate per
     state is handled by the body.state-* rules below. */
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;                            /* canvas stays reachable */
    z-index: 21;
  }
  /* Two bars, each a three column grid: start group, centered group, end
     group. The grid is what makes overlap structurally impossible. The centre
     column is exactly centred while the two 1fr columns have room to spare,
     and if the start group ever needs more than its share the column simply
     grows and the centre shifts slightly instead of anything colliding. The
     old approach positioned each cluster independently, so a wide start group
     and a centred button could and did overlap on a narrow phone. */
  /* The bar rules are shared by both screens. They were once scoped to #ui
     alone, which left the edit screen's bars unstyled and stacked every edit
     control in one column at the top left. */
  #ui .bar, #editUi .bar {
    position: fixed;
    left: 0;
    right: 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: var(--gap);
    box-sizing: border-box;
  }
  #ui .bar-top, #editUi .bar-top {
    top: 0;
    padding: var(--edge-top) var(--edge-right) 0 var(--edge-left);
  }
  #ui .bar-bottom, #editUi .bar-bottom {
    bottom: 0;
    padding: 0 var(--edge-right) var(--edge-bottom) var(--edge-left);
  }

  #ui .group, #editUi .group { display: flex; align-items: center; gap: var(--group-gap); }
  #ui .group > *, #editUi .group > * { pointer-events: auto; }  /* tappable */
  /* Explicit columns. Without them a hidden group (display: none drops it from
     the grid) lets the next one auto-place into its column, which is how
     Close ended up mid-bar on the error screen. */
  #ui .group-start,  #editUi .group-start  { justify-self: start;  grid-column: 1; grid-row: 1; }
  #ui .group-center, #editUi .group-center { justify-self: center; grid-column: 2; grid-row: 1; }
  #ui .group-end,    #editUi .group-end    { justify-self: end;    grid-column: 3; grid-row: 1; }

  /* While loading there is nothing to apply a material to or to share, and on
     the error card only Close makes sense. Hiding the rest avoids buttons that
     would do nothing when tapped. */
  body.state-loading #matGroup,
  body.state-loading #shareGroup,
  body.state-error #ui .group:not(#closeGroup) { display: none; }

  /* The hidden attribute is applied by the UA stylesheet, so ANY author level
     display rule outranks it. .btn and .group both set display, which is how
     the hidden Edit button ended up visible. This blanket rule makes hidden
     authoritative everywhere and is the reason the element specific
     .overlay[hidden] and #debugLog[hidden] rules below are now redundant. */
  [hidden] { display: none !important; }

  /* ---- Controls, painted on canvas -----------------------------------
     Every coloured control is a transparent shell wrapping a canvas, and the
     canvas is the entire visual. This is deliberate: Samsung Internet's dark
     mode rewrites CSS colours, so a CSS background here comes out dark brown
     instead of beige. Canvas pixels were proven immune on the device, which is
     why no colour below is expressed in CSS. */
  button {
    font: inherit;
    margin: 0;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;                      /* no double-tap zoom */
    -webkit-appearance: none;
    appearance: none;
  }

  .iconBtn, .swatch {
    background: none;
    border: 0;
    padding: 0;
    display: block;
    line-height: 0;
    transition: transform 0.1s ease;
  }
  .iconBtn { width: var(--btn); height: var(--btn); }
  .swatch  { width: var(--swatch); height: var(--swatch); }
  .iconBtn > canvas, .swatch > canvas { display: block; }
  .iconBtn:active, .swatch:active { transform: scale(0.92); }

  /* The focus ring is the one control colour left in CSS. A forced dark mode
     may recolour it, which is cosmetic only, and both colours are drawn so one
     of them always contrasts. */
  .iconBtn:focus-visible, .swatch:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 1px;
    box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.55);
  }

  /* Screen reader only. The message screens paint their text into a canvas so
     a forced dark mode cannot wash it out, so the real text lives here to stay
     available to assistive technology and to translation. */
  .srOnly {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  /* ---- Overlays: loading, error, end screen --------------------------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
    box-sizing: border-box;
    text-align: center;
  }
  .overlay[hidden] { display: none; }

  /* The error and end screens paint their whole surface, message text and
     button included, into one canvas. The real button is transparent and is
     positioned over the painted pill from the same geometry, so the hit area
     and the artwork cannot disagree. */
  .overlayCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlayBtn {
    position: absolute;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
  }
  .overlayBtn:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 2px;
    border-radius: 999px;
  }


  #loading { background: transparent; pointer-events: none; }

  /* The error and end screens are painted into their canvas, so nothing here
     carries a colour that a forced dark mode could rewrite. */
  #error, #endScreen { background: transparent; }

  /* ---- Edit screen ----------------------------------------------------
     The frozen view and every stroke live in one canvas, because that is what
     captureStream records: image and annotations have to share a surface to end
     up in one video file. */
  #editScreen { background: transparent; }
  #editCanvas {
    position: absolute;
    display: block;
    touch-action: none;            /* strokes, not scrolling */
  }

  /* The edit screen has its own bars, laid out like the main screen's. */
  #editUi {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 22;
  }

  /* The left column runs bottom to top: pen, undo, clear, colour. Children are
     in that DOM order and column-reverse puts the first one at the bottom,
     nearest the thumb. */
  #editUi .toolColumn {
    flex-direction: column-reverse;
    align-items: flex-start;
  }
  #editUi .bar-bottom { align-items: end; }

  /* The record button is taller than the others by the timer strip painted
     above its disc, so the running time sits inside the button's own box and
     can never overlap a neighbour or fall off the bottom edge. */
  #editUi .recordBtn { height: calc(var(--btn) + 16px); }

  /* The six pen colours, revealed by the colour button. Positioned from the
     colour button's own rect at runtime rather than from a calc, so adding a
     tool to the column cannot misplace it. */
  #penColorRow {
    position: fixed;
    display: flex;
    gap: var(--group-gap);
    z-index: 23;
    pointer-events: auto;
  }

  /* ---- Debug log (only inserted when DEBUG is true) ------------------- */
  #debugLog {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: calc(var(--edge-bottom) + var(--btn) + 16px);
    max-height: 32vh;
    overflow-y: auto;
    z-index: 30;
    background: rgba(18, 18, 18, 0.92);
    color: #ddd;
    font-family: Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.45;
    padding: 6px 8px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-break: break-all;
    pointer-events: auto;
  }
  #debugLog[hidden] { display: none; }
  #debugLog .ok  { color: #8fdc8f; }
  #debugLog .err { color: #ff8f8f; }
  #debugLog .ts  { color: #8a8a8a; }
</style>

<!--
  ===========================================================================
  IMPORT MAP
  Pins one three.js version on jsDelivr. A CORS-enabled CDN is what lets
  this page work both from file:// during local testing and from GitHub
  Pages in production.
  ===========================================================================
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>

<!-- state-loading is set here too, so the spinner state is correct in the first
     frame, before the module script runs. -->
<body class="bg-dark state-loading">

<!-- 3D view -->
<canvas id="view"></canvas>

<!--
  ===========================================================================
  UI LAYER
  Icon-only round buttons in five fixed positions. Nothing here needs
  reading: swatches show their own color, the background buttons show the
  two backgrounds, and the remaining three use standard icons.
  ===========================================================================
-->
<div id="ui">

  <!-- Plain buttons wrapping a canvas. The canvas is the entire visual,
       because a forced dark mode rewrites CSS colours but cannot touch
       canvas pixels. -->

  <!-- ===== Top bar: background presets at the left, close at the right ===== -->
  <div class="bar bar-top">

  <!-- Background presets, light then dark. Both carry the brand colour; the
       active one gets a light ring, which reads against the brand disc where a
       brand ring would not. -->
  <div class="group group-start">
    <button id="bgLight" class="iconBtn" type="button" aria-pressed="false" aria-label="Light background"><canvas aria-hidden="true"></canvas></button>
    <button id="bgDark" class="iconBtn" type="button" aria-pressed="true" aria-label="Dark background"><canvas aria-hidden="true"></canvas></button>
  </div>

  <!-- Nothing in the middle of the top bar; the spacer keeps the grid at three
       columns so the top and bottom bars align. -->
  <div class="group group-center"></div>

  <!-- Close -->
  <div class="group group-end" id="closeGroup">
    <button id="closeBtn" class="iconBtn" type="button" aria-label="Close"><canvas aria-hidden="true"></canvas></button>
  </div>

  </div><!-- /bar-top -->

  <!-- ===== Bottom bar: materials, center action, share ===== -->
  <div class="bar bar-bottom">

  <!-- Material presets, chrome then aged bronze then anthracite. Each swatch is
       painted with its own material colour and, when active, a ring in the
       brand colour. -->
  <div class="group group-start" id="matGroup">
    <button id="matChrome" class="swatch" type="button" aria-pressed="true" aria-label="Chrome"><canvas aria-hidden="true"></canvas></button>
    <button id="matBronze" class="swatch" type="button" aria-pressed="false" aria-label="Aged bronze"><canvas aria-hidden="true"></canvas></button>
    <button id="matAnthracite" class="swatch" type="button" aria-pressed="false" aria-label="Anthracite"><canvas aria-hidden="true"></canvas></button>
  </div>

  <!-- Center: Edit. Opens the edit screen in this same page. -->
  <div class="group group-center" id="centerGroup">
    <button id="editBtn" class="iconBtn" type="button" aria-label="Edit"><canvas aria-hidden="true"></canvas></button>
  </div>

  <!-- Share -->
  <div class="group group-end" id="shareGroup">
    <button id="shareBtn" class="iconBtn" type="button" aria-label="Share"><canvas aria-hidden="true"></canvas></button>
  </div>

  </div><!-- /bar-bottom -->

</div>

<!-- Loading indicator. The spinner and the percentage are painted into the
     canvas; the percentage also stays in the DOM, hidden but announced, which
     is the element the Drive fetch already writes to. -->
<div id="loading" class="overlay">
  <canvas id="spinnerCanvas" aria-hidden="true"></canvas>
  <div id="loadPercent" class="srOnly" aria-live="polite"></div>
</div>

<!-- Friendly failure message. No technical detail here at any time. The whole
     card is painted into the canvas; the text below it is for screen readers
     and is the source the painter reads. -->
<div id="error" class="overlay" hidden>
  <canvas id="errorCanvas" class="overlayCanvas" aria-hidden="true"></canvas>
  <p class="srOnly" id="errorText">This model could not be loaded. Please try again.</p>
  <button id="retryBtn" class="overlayBtn" type="button" aria-label="Try again"></button>
</div>

<!-- Edit screen. Same page, no navigation: the frozen view fills the canvas
     and every control is painted, exactly as on the main screen. -->
<div id="editScreen" class="overlay" hidden>
  <canvas id="editCanvas"></canvas>

  <div id="editUi">

    <div class="bar bar-top">
      <div class="group group-start"></div>
      <div class="group group-center"></div>
      <div class="group group-end">
        <button id="editCloseBtn" class="iconBtn" type="button" aria-label="Close editing"><canvas aria-hidden="true"></canvas></button>
      </div>
    </div>

    <div class="bar bar-bottom">
      <!-- Bottom to top: pen, undo, clear, colour. -->
      <div class="group group-start toolColumn">
        <button id="penBtn" class="iconBtn" type="button" aria-pressed="true" aria-label="Pen"><canvas aria-hidden="true"></canvas></button>
        <button id="undoBtn" class="iconBtn" type="button" aria-label="Undo last stroke"><canvas aria-hidden="true"></canvas></button>
        <button id="clearBtn" class="iconBtn" type="button" aria-label="Clear all strokes"><canvas aria-hidden="true"></canvas></button>
        <button id="penColorBtn" class="iconBtn" type="button" aria-expanded="false" aria-label="Pen colour"><canvas aria-hidden="true"></canvas></button>
      </div>

      <div class="group group-center">
        <button id="recordBtn" class="iconBtn recordBtn" type="button" aria-label="Record voice"><canvas aria-hidden="true"></canvas></button>
      </div>

      <div class="group group-end">
        <button id="editShareBtn" class="iconBtn" type="button" aria-label="Share"><canvas aria-hidden="true"></canvas></button>
      </div>
    </div>

    <!-- Filled from CONFIG.edit.penColors at startup. -->
    <div id="penColorRow" hidden></div>

  </div>
</div>

<!-- End screen, shown when window.close() is not permitted by the browser -->
<div id="endScreen" class="overlay" hidden>
  <canvas id="endCanvas" class="overlayCanvas" aria-hidden="true"></canvas>
  <p class="srOnly" id="endText">You can close this page now.</p>
  <button id="reopenBtn" class="overlayBtn" type="button" aria-label="Open again"></button>
</div>

<!--
  ===========================================================================
  STARTUP WATCHDOG (classic script)
  Runs before the module. If three.js cannot be fetched from the CDN the
  module never executes and nothing inside it could report that, so this
  shows the friendly error instead of an endless spinner.
  ===========================================================================
-->
<script>
  (function () {
    window.__viewerReady = false;
    setTimeout(function () {
      if (window.__viewerReady) return;
      var loading = document.getElementById('loading');
      var error = document.getElementById('error');
      if (loading) loading.hidden = true;
      if (error) error.hidden = false;
      document.body.classList.remove('state-loading');
      document.body.classList.add('state-error');
    }, 15000);
  })();
</script>

<!--
  ===========================================================================
  MAIN SCRIPT (ES module)
  ===========================================================================
-->
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  /* =========================================================================
     CONFIG
     Everything tweakable lives here. DEBUG is the only switch that changes
     what the customer sees: when true an on-screen log panel is added, when
     false the page stays silent and shows no technical detail at all.
     ========================================================================= */
  // File level switch: set to true to force the log panel on for every visit.
  const DEBUG_ALWAYS_ON = false;

  // debug=1 in the URL turns the on-screen log panel on without editing this
  // file, which is the only practical way to diagnose a real phone. Read
  // straight from location so DEBUG is settled before the first log() call.
  const DEBUG = DEBUG_ALWAYS_ON ||
    new URLSearchParams(location.search).get('debug') === '1';

  // Bumped by hand when something ships, and printed in the diagnostics, so a
  // stale cached page can be told apart from a current one at a glance.
  // Must match version.json at the repo root, in the same commit. The
  // self-update check below compares the two.
  const VIEWER_VERSION = '2026-10-08e';

  const CONFIG = {

    /* ---- Google Drive ---------------------------------------------------
       No API key lives in this file, or anywhere in the repository: the
       repository is public. The key travels in the link as the k parameter
       (see URL PARAMETERS) and is never shown in full, on screen or in the
       log. */
    driveFilesUrl: 'https://www.googleapis.com/drive/v3/files/',

    /* ---- three.js ------------------------------------------------------- */
    threeVersion: '0.186.1',

    /* ---- Renderer ------------------------------------------------------
       preserveDrawingBuffer keeps the last frame readable so Share can grab
       the canvas synchronously. That synchronous read is what keeps the call
       inside the user gesture iOS Safari requires for navigator.share. */
    maxPixelRatio: 2,
    preserveDrawingBuffer: true,
    toneMappingExposure: 1.0,

    /* ---- Backgrounds ---------------------------------------------------
       A subtle vertical gradient per preset, slightly darker toward the
       bottom. Tweak the two stops of either preset here; everything else
       follows, including the round preview buttons, the overlay screens and
       the browser UI tint.

       The gradient is drawn INSIDE the WebGL canvas as scene.background, not
       as CSS behind the canvas, for two reasons. It is then part of the
       rendered frame, so Share captures it exactly as seen on screen. And
       three.js skips tone mapping for a background texture tagged as sRGB, so
       these hex values reach the screen unshifted.

       This does not light anything: reflections and material response come
       from scene.environment, which the background never touches. */
    background: {
      light: { top: '#eae2d5', bottom: '#d7d0c4' },
      dark:  { top: '#15161a', bottom: '#0d0e11' }
    },

    // Height in pixels of the gradient ramp texture. Taller means a smoother
    // ramp with less visible banding; 1 px wide is all that is needed.
    backgroundGradientHeight: 512,

    /* ---- Reflection environment ----------------------------------------
       RoomEnvironment is built procedurally inside three.js and baked once
       into a small cubemap. No HDRI file is downloaded, so phones get metal
       reflections without any extra network traffic. */
    environment: {
      blur: 0.04,            // PMREM roughness blur applied to the room
      lightIntensity: 0.55   // small camera-mounted light for shape definition
    },

    /* ---- Materials -----------------------------------------------------
       One entry per round swatch at the bottom left, in display order.
       swatch is only the button color; the rest drives the real material.

       defaultBackground is the background this material looks best against.
       Tapping a material button switches to it. The customer can still pick
       the other background afterwards, and that choice holds until the next
       material tap.

       None of the three uses a texture map, so nothing here depends on UV
       coordinates. Aged bronze gets its variation from a procedural 3D
       noise field evaluated in world space (see PATINA SHADER below), which
       works on raw 3ds Max geometry with no UVs at all. */
    materials: {

      chrome: {
        label: 'Chrome',
        swatch: '#d9dadc',
        defaultBackground: 'dark',
        color: '#ffffff',
        metalness: 1.0,
        roughness: 0.05,
        envMapIntensity: 1.25
      },

      bronze: {
        label: 'Aged bronze',
        swatch: '#6b4a2b',
        defaultBackground: 'dark',
        colorHigh: '#8a6436',   // rubbed, exposed bronze
        colorLow:  '#3a2a1a',   // dark oxidized patina
        metalness: 0.9,
        roughnessHigh: 0.35,    // roughness where colorHigh shows
        roughnessLow:  0.55,    // roughness where colorLow shows
        envMapIntensity: 1.0,
        patinaScale: 2.5,       // noise frequency, in world units
        patinaContrast: [0.35, 0.75], // smoothstep edges, blotch hardness
        upwardWear: 0.55,       // how much upward faces rub bright (0..1)
        edgeWear: 0.4           // fresnel edge brightening strength
      },

      anthracite: {
        label: 'Anthracite',
        swatch: '#3a3d40',
        defaultBackground: 'light',
        color: '#34373a',
        metalness: 0.55,
        roughness: 0.4,
        envMapIntensity: 1.0
      }

    },


    /* ---- UI ------------------------------------------------------------
       brandColor tints every icon button and the active ring on the material
       swatches, and the edit screen reuses it for every control there.

       White on #5b5fc7 measures 5.4 to 1, comfortably past the 3 to 1 a glyph
       needs, and it does not change with the theme because the disc colour is
       fixed. */
    ui: {
      brandColor: '#5b5fc7',
      iconColor: '#ffffff',      // glyph and pill label on the brand colour
      iconScale: 0.46,           // glyph size as a fraction of the button
      selectedRing: '#ffffff',   // ring on the active background button
      ringWidth: 3,
      spinnerSize: 44,
      spinnerTrack: 'rgba(128, 128, 128, 0.34)',
      spinnerText: '#8b9096',
      textOnLight: '#2a2d31',
      textOnDark: '#e9eaec',
      retryLabel: 'Try again',
      reopenLabel: 'Open again'
    },

    /* ---- Share ---------------------------------------------------------
       JPEG keeps the file small for WhatsApp and mail and avoids any
       transparency surprises in other apps. */
    share: {
      mimeType: 'image/jpeg',
      quality: 0.92,
      fileName: 'model-view.jpg'
    },

    /* ---- Edit screen ---------------------------------------------------
       The six pen colours in the order the row shows them; the first is the
       default. Everything the recorder needs is here too. */
    edit: {
      penColors: ['#e5342b', '#2f6fe0', '#f2c230', '#2faa54', '#15161a', '#ffffff'],
      penWidth: 4,                 // stroke width in CSS pixels
      maxRecordSeconds: 120,       // automatic stop
      recordFps: 25,

      /* The recording is NOT taken at the device pixel size. The long side is
         capped here, and both dimensions are forced even because H.264
         encoders commonly require it. The shared still image is unaffected and
         keeps the full display resolution. */
      recordLongSide: 1280,

      /* Tried in order; the first the browser supports wins. MP4 leads because
         it is what WhatsApp accepts, confirmed working on Samsung Internet 30
         (Chromium 143) on a Galaxy S25 Ultra. If none of these is supported the
         record button goes to a disabled state and only the annotated image can
         be shared: no separate audio file and no transcoding. */
      videoTypes: [
        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
        'video/mp4;codecs=avc1,mp4a.40.2',
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs="vp9,opus"',
        'video/webm;codecs="vp8,opus"',
        'video/webm'
      ],

      imageType: 'image/jpeg',
      imageQuality: 0.92,
      fileBase: 'model-note',      // extension is derived from the real type
      recordingDisc: '#d93025'     // the stop disc while recording
    },

    /* ---- Camera framing ------------------------------------------------- */
    camera: {
      fov: 45,
      direction: [1, 0.6, 1],  // three-quarter view, slightly above
      fitMargin: 1.1           // >1 leaves a little air around the model
    }

  };

  /* Valid URL parameter values. Anything else falls back to the default
     silently, because the customer can do nothing about a bad link. */
  const MATERIAL_KEYS = ['chrome', 'bronze', 'anthracite'];
  const BACKGROUND_KEYS = ['light', 'dark'];
  const DEFAULT_MATERIAL = 'chrome';
  // There is no single default background: each material carries its own in
  // CONFIG.materials[key].defaultBackground. A bg parameter overrides that for
  // the initial state only.

  const DRACO_DECODER_PATH =
    'https://cdn.jsdelivr.net/npm/three@' + CONFIG.threeVersion +
    '/examples/jsm/libs/draco/gltf/';

  /* =========================================================================
     LOGGING
     Silent unless DEBUG is true. With DEBUG the log panel is created on
     demand and every line also goes to the browser console. The panel exists
     because a phone has no reachable console.
     ========================================================================= */
  let logEl = null;

  function ensureLogPanel() {
    if (logEl || !DEBUG) return logEl;
    logEl = document.createElement('div');
    logEl.id = 'debugLog';
    document.body.appendChild(logEl);
    // Tapping the panel collapses it so it never blocks the view for long.
    logEl.addEventListener('click', () => { logEl.hidden = true; });
    return logEl;
  }

  function timestamp() {
    const d = new Date();
    const pad = (n, w) => String(n).padStart(w, '0');
    return pad(d.getHours(), 2) + ':' + pad(d.getMinutes(), 2) + ':' +
      pad(d.getSeconds(), 2) + '.' + pad(d.getMilliseconds(), 3);
  }

  // Returns the text node of the new line so progress can be rewritten in place.
  function log(text, level = 'info') {
    if (!DEBUG) return null;
    text = redactKeys(text);
    if (level === 'err') console.error(text); else console.log(text);
    const panel = ensureLogPanel();
    const line = document.createElement('div');
    const ts = document.createElement('span');
    ts.className = 'ts';
    ts.textContent = timestamp() + ' ';
    const msg = document.createElement('span');
    if (level !== 'info') msg.className = level;
    msg.textContent = text;
    line.appendChild(ts);
    line.appendChild(msg);
    panel.appendChild(line);
    panel.scrollTop = panel.scrollHeight;
    return msg;
  }

  /* The API key must never appear in full on screen or in the console. Every
     log line passes through here, which covers the URL in the diagnostics and
     Google's error bodies, which echo the key back. Anything shaped like a
     Google API key is masked as well as the link's own key, in case Google
     ever returns it encoded differently. */
  function maskKey(key) {
    if (!key) return '(none)';
    if (key.length <= 8) return '****';
    return key.slice(0, 4) + '...' + key.slice(-4);
  }
  function redactKeys(text) {
    let out = String(text);
    if (typeof apiKey === 'string' && apiKey) {
      out = out.split(apiKey).join(maskKey(apiKey));
      const encoded = encodeURIComponent(apiKey);
      if (encoded !== apiKey) out = out.split(encoded).join(maskKey(apiKey));
    }
    // Inline rather than a module constant, so log() is safe to call from
    // anywhere above this point in the script.
    return out.replace(/AIza[0-9A-Za-z_-]{35}/g, (match) => maskKey(match));
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(2) + ' MB';
  }

  // Errors that were already logged, so the catch block stays quiet.
  class LoggedError extends Error {}

  /* =========================================================================
     URL PARAMETERS
     model = Drive file ID (required)
     k     = Google API key for the Drive request (required). It is in the link
             rather than in this file because the repository is public.
     mat   = chrome | bronze | anthracite   (optional, default chrome)
     bg    = light | dark                   (optional, default light)
     ========================================================================= */

  // Accepts a bare file ID or a pasted Drive link, in case a link ends up in
  // the parameter instead of the ID.
  function extractFileId(input) {
    const s = String(input || '').trim();
    let m = s.match(/\/d\/([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    m = s.match(/[?&]id=([A-Za-z0-9_-]+)/);
    if (m) return m[1];
    return s;
  }

  const params = new URLSearchParams(location.search);
  const modelId = extractFileId(params.get('model'));
  // var, not const: redactKeys() reads it from log(), which can run before
  // this line, and a const would still be in its temporal dead zone then.
  var apiKey = (params.get('k') || '').trim();

  const requestedMaterial = params.get('mat');
  let materialKey = MATERIAL_KEYS.includes(requestedMaterial)
    ? requestedMaterial
    : DEFAULT_MATERIAL;

  // An explicit bg wins over the starting material's own default, but only for
  // the initial state: the next material tap applies that material's default
  // again.
  const requestedBackground = params.get('bg');
  const backgroundExplicit = BACKGROUND_KEYS.includes(requestedBackground);
  let backgroundKey = backgroundExplicit
    ? requestedBackground
    : CONFIG.materials[materialKey].defaultBackground;

  /* =========================================================================
     SCREENS
     The whole page is one document with no navigation. showScreen swaps which
     overlay is visible; Phase 3 adds an 'edit' screen to this same switch.
     ========================================================================= */
  const canvas = document.getElementById('view');
  const uiLayer = document.getElementById('ui');
  const loadingEl = document.getElementById('loading');
  const loadPercentEl = document.getElementById('loadPercent');
  const errorEl = document.getElementById('error');
  const endScreenEl = document.getElementById('endScreen');

  let currentScreen = 'main';

  function showScreen(name) {
    currentScreen = name;
    const isMain = (name === 'main');
    const isEdit = (name === 'edit');

    // The WebGL canvas and the main bars belong to the main screen only. On the
    // edit screen the frozen still stands in for the 3D view.
    canvas.style.visibility = isMain ? 'visible' : 'hidden';
    uiLayer.hidden = !isMain;
    editScreenEl.hidden = !isEdit;
    endScreenEl.hidden = (name !== 'end');

    // Rendering is pointless off the main screen and costs battery.
    if (isMain) startRenderLoop(); else stopRenderLoop();
    repaintOverlays();
    if (isEdit) repaintEditControls();
    log('Screen: ' + name);
  }

  function showLoading(on) {
    loadingEl.hidden = !on;
    document.body.classList.toggle('state-loading', on);
    if (!on) loadPercentEl.textContent = '';
    if (on) startSpinner(); else stopSpinner();
  }

  // One short sentence, never a technical reason.
  function showError(message) {
    showLoading(false);
    document.getElementById('errorText').textContent = message;
    errorEl.hidden = false;
    document.body.classList.add('state-error');
    repaintOverlays();
  }

  function hideError() {
    errorEl.hidden = true;
    document.body.classList.remove('state-error');
  }

  /* =========================================================================
     RENDERER, SCENE, CAMERA, CONTROLS
     ========================================================================= */
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    preserveDrawingBuffer: CONFIG.preserveDrawingBuffer
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.maxPixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CONFIG.toneMappingExposure;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    CONFIG.camera.fov, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(3, 2, 3);
  scene.add(camera);   // the key light rides on the camera

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  // OrbitControls defaults already match the gestures we want on a phone:
  // one finger orbits, two fingers pinch to zoom and pan.

  // A single soft light that follows the camera. The environment map does
  // most of the lighting work, so this only adds shape definition.
  const keyLight = new THREE.DirectionalLight(0xffffff, CONFIG.environment.lightIntensity);
  keyLight.position.set(0.6, 1.0, 0.8);
  camera.add(keyLight);

  /* Builds one background gradient as a 1 x N canvas texture. One pixel wide
     is enough: the gradient only varies vertically, and the full screen quad
     three.js uses for a texture background stretches it across the whole
     width whatever the aspect ratio is.

     Orientation: Texture.flipY defaults to true, so canvas row 0 is uploaded
     to the top of the screen, which is where the "top" color belongs.

     Tagging the texture as sRGB is load bearing. three.js derives the
     background material's toneMapped flag from the texture color space, so an
     sRGB texture bypasses ACES tone mapping and the configured hex values
     reach the screen exactly as written. */
  function createBackgroundTexture(spec) {
    const ramp = document.createElement('canvas');
    ramp.width = 1;
    ramp.height = CONFIG.backgroundGradientHeight;

    const ctx = ramp.getContext('2d');
    const gradient = ctx.createLinearGradient(0, 0, 0, ramp.height);
    gradient.addColorStop(0, spec.top);
    gradient.addColorStop(1, spec.bottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, ramp.width, ramp.height);

    const texture = new THREE.CanvasTexture(ramp);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.generateMipmaps = false;          // pointless for a 1 x N ramp
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
    return texture;
  }

  // Both gradients are built once at startup and only swapped on toggle.
  const backgroundTextures = {
    light: createBackgroundTexture(CONFIG.background.light),
    dark: createBackgroundTexture(CONFIG.background.dark)
  };

  function applyBackground(key) {
    backgroundKey = key;
    const spec = CONFIG.background[key];

    // scene.background is the rendered backdrop only. scene.environment, which
    // drives the reflections and the material look, is deliberately untouched.
    scene.background = backgroundTextures[key];

    document.body.classList.toggle('bg-light', key === 'light');
    document.body.classList.toggle('bg-dark', key === 'dark');

    // The overlay screens and the first paint before WebGL starts read these,
    // so the whole page matches the canvas.
    document.documentElement.style.setProperty('--bg-top', spec.top);
    document.documentElement.style.setProperty('--bg-bottom', spec.bottom);

    // The browser UI tints itself with the color at the top of the page.
    document.querySelector('meta[name="theme-color"]')
      .setAttribute('content', spec.top);

    for (const k of BACKGROUND_KEYS) {
      bgButtons[k].setAttribute('aria-pressed', String(k === key));
    }

    // The painted controls carry the selection state and the message screens
    // use this gradient, so both are redrawn.
    repaintUi();
    log('Background: ' + key);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

    // The button sizes are clamp()ed against viewport width and the message
    // screens are full bleed, so everything painted has to be redrawn.
    repaintUi();

    // The edit canvas covers the viewport, so it is rebuilt and replayed. The
    // strokes are stored normalised, which is what makes that safe.
    if (currentScreen === 'edit' && editStill) {
      layoutEditCanvas();
      redrawEdit();
      repaintEditControls();
    }
  });

  /* Render loop. Kept running on the main screen because OrbitControls
     damping needs continuous frames; stopped on every other screen. */
  let loopRunning = false;

  function startRenderLoop() {
    if (loopRunning) return;
    loopRunning = true;
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  }

  function stopRenderLoop() {
    if (!loopRunning) return;
    loopRunning = false;
    renderer.setAnimationLoop(null);
  }

  /* =========================================================================
     REFLECTION ENVIRONMENT
     RoomEnvironment is a small scene of emissive panels built in code. Baking
     it through PMREMGenerator once gives every metal something to reflect
     with no HDRI download.
     ========================================================================= */
  function buildEnvironment() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new RoomEnvironment();
    const target = pmrem.fromScene(room, CONFIG.environment.blur);
    scene.environment = target.texture;
    // The source scene and the generator are not needed after the bake.
    room.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    pmrem.dispose();
    log('Environment ready (RoomEnvironment, no HDRI file).', 'ok');
  }

  /* =========================================================================
     PATINA SHADER (aged bronze)
     MeshStandardMaterial with two injected snippets, so three.js keeps doing
     all the physically based lighting and the environment reflections.

     The injection does three things, none of which touch UV coordinates:
       1. A 3D value-noise field sampled at the WORLD position of each pixel.
          Because the noise is volumetric it needs no projection and no
          seams, which is exactly what geometry with no UVs requires.
       2. An upward-facing bias, so horizontal surfaces rub brighter and
          downward surfaces stay dark, the way real bronze weathers.
       3. A fresnel term, so silhouette edges catch a worn highlight.

     The resulting mask blends colorLow -> colorHigh and roughnessLow ->
     roughnessHigh together, so color and finish vary as one.
     ========================================================================= */

  const PATINA_VERTEX_DECLARATIONS = /* glsl */`
    varying vec3 vPatinaWorldPos;
    varying vec3 vPatinaWorldNormal;
  `;

  const PATINA_VERTEX_BODY = /* glsl */`
    vPatinaWorldPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
    vPatinaWorldNormal = normalize( mat3( modelMatrix ) * objectNormal );
  `;

  const PATINA_FRAGMENT_DECLARATIONS = /* glsl */`
    varying vec3 vPatinaWorldPos;
    varying vec3 vPatinaWorldNormal;

    uniform vec3  uPatinaHigh;
    uniform vec3  uPatinaLow;
    uniform float uPatinaRoughHigh;
    uniform float uPatinaRoughLow;
    uniform float uPatinaScale;
    uniform vec2  uPatinaContrast;
    uniform float uPatinaUpwardWear;
    uniform float uPatinaEdgeWear;

    // Cheap hash based value noise. No texture lookup, no UVs.
    float patinaHash( vec3 p ) {
      p = fract( p * 0.3183099 + 0.1 );
      p *= 17.0;
      return fract( p.x * p.y * p.z * ( p.x + p.y + p.z ) );
    }

    float patinaNoise( vec3 x ) {
      vec3 i = floor( x );
      vec3 f = fract( x );
      f = f * f * ( 3.0 - 2.0 * f );
      return mix(
        mix( mix( patinaHash( i + vec3( 0.0, 0.0, 0.0 ) ),
                  patinaHash( i + vec3( 1.0, 0.0, 0.0 ) ), f.x ),
             mix( patinaHash( i + vec3( 0.0, 1.0, 0.0 ) ),
                  patinaHash( i + vec3( 1.0, 1.0, 0.0 ) ), f.x ), f.y ),
        mix( mix( patinaHash( i + vec3( 0.0, 0.0, 1.0 ) ),
                  patinaHash( i + vec3( 1.0, 0.0, 1.0 ) ), f.x ),
             mix( patinaHash( i + vec3( 0.0, 1.0, 1.0 ) ),
                  patinaHash( i + vec3( 1.0, 1.0, 1.0 ) ), f.x ), f.y ),
        f.z );
    }

    // Four octaves give large blotches with fine grain inside them.
    float patinaFbm( vec3 p ) {
      float sum = 0.0;
      float amp = 0.5;
      for ( int i = 0; i < 4; i ++ ) {
        sum += amp * patinaNoise( p );
        p *= 2.02;
        amp *= 0.5;
      }
      return sum;
    }

    // 0.0 = deep patina, 1.0 = rubbed bright metal.
    float patinaWearMask() {
      vec3 n = normalize( vPatinaWorldNormal );

      float blotches = patinaFbm( vPatinaWorldPos * uPatinaScale );
      blotches = smoothstep( uPatinaContrast.x, uPatinaContrast.y, blotches );

      // n.y is +1 straight up and -1 straight down.
      float upward = clamp( n.y * 0.5 + 0.5, 0.0, 1.0 );
      float mask = blotches * mix( 1.0 - uPatinaUpwardWear, 1.0, upward );

      vec3 viewDir = normalize( cameraPosition - vPatinaWorldPos );
      float fresnel = 1.0 - abs( dot( viewDir, n ) );
      mask += uPatinaEdgeWear * pow( fresnel, 3.0 );

      return clamp( mask, 0.0, 1.0 );
    }
  `;

  // Builds the aged bronze material. material.color stays white so the
  // shader result is the final albedo.
  function createBronzeMaterial(cfg) {
    const material = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      metalness: cfg.metalness,
      roughness: cfg.roughnessHigh,
      envMapIntensity: cfg.envMapIntensity,
      side: THREE.DoubleSide
    });

    const uniforms = {
      uPatinaHigh:       { value: new THREE.Color(cfg.colorHigh) },
      uPatinaLow:        { value: new THREE.Color(cfg.colorLow) },
      uPatinaRoughHigh:  { value: cfg.roughnessHigh },
      uPatinaRoughLow:   { value: cfg.roughnessLow },
      uPatinaScale:      { value: cfg.patinaScale },
      uPatinaContrast:   { value: new THREE.Vector2(cfg.patinaContrast[0], cfg.patinaContrast[1]) },
      uPatinaUpwardWear: { value: cfg.upwardWear },
      uPatinaEdgeWear:   { value: cfg.edgeWear }
    };
    // Kept on the material so the values stay reachable for live tweaking.
    material.userData.patinaUniforms = uniforms;

    material.onBeforeCompile = (shader) => {
      Object.assign(shader.uniforms, uniforms);

      // Vertex: hand the world position and world normal to the fragment
      // stage. project_vertex is the first point where `transformed` is final.
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>' + PATINA_VERTEX_DECLARATIONS)
        .replace('#include <project_vertex>', '#include <project_vertex>' + PATINA_VERTEX_BODY);

      // Fragment: map_fragment is where the albedo would normally be sampled
      // from a texture, and roughnessmap_fragment is where roughnessFactor is
      // defined. Replacing both keeps everything downstream untouched.
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>' + PATINA_FRAGMENT_DECLARATIONS)
        .replace('#include <map_fragment>', /* glsl */`
          float patinaWear = patinaWearMask();
          diffuseColor.rgb *= mix( uPatinaLow, uPatinaHigh, patinaWear );
        `)
        .replace('#include <roughnessmap_fragment>', /* glsl */`
          float roughnessFactor = mix( uPatinaRoughLow, uPatinaRoughHigh, patinaWear );
        `);
    };

    // Keeps this program out of the shader cache slot of plain
    // MeshStandardMaterials, which have the same parameter signature.
    material.customProgramCacheKey = () => 'aged-bronze-patina';

    return material;
  }

  // Plain metals and painted finishes need no shader work: with no texture
  // maps at all they are already independent of UV coordinates.
  function createPlainMaterial(cfg) {
    return new THREE.MeshStandardMaterial({
      color: new THREE.Color(cfg.color),
      metalness: cfg.metalness,
      roughness: cfg.roughness,
      envMapIntensity: cfg.envMapIntensity,
      side: THREE.DoubleSide
    });
  }

  const materials = {
    chrome: createPlainMaterial(CONFIG.materials.chrome),
    bronze: createBronzeMaterial(CONFIG.materials.bronze),
    anthracite: createPlainMaterial(CONFIG.materials.anthracite)
  };

  /* =========================================================================
     MATERIAL SWITCHING
     One preset is applied to every mesh of the model. The materials that come
     with the GLB are discarded; these models are exported as geometry only.
     ========================================================================= */
  let currentModel = null;

  /* Applies one preset to the whole model.

     followDefaultBackground is true for every material button tap, which is
     what makes the background follow the material. It is false only when the
     link carried an explicit bg, so that choice survives the initial apply.
     A background the customer then picks by hand simply holds until the next
     material tap. */
  function applyMaterial(key, followDefaultBackground = true) {
    materialKey = key;
    if (currentModel) {
      currentModel.traverse((o) => { if (o.isMesh) o.material = materials[key]; });
    }
    for (const k of MATERIAL_KEYS) {
      materialButtons[k].setAttribute('aria-pressed', String(k === key));
    }
    repaintControls();
    log('Material: ' + CONFIG.materials[key].label);

    if (followDefaultBackground) {
      applyBackground(CONFIG.materials[key].defaultBackground);
    }
  }

  /* =========================================================================
     DRIVE FETCH
     Drive API v3 files.get with alt=media. Progress is reported as a
     percentage when Drive sends a Content-Length.
     ========================================================================= */
  async function fetchDriveFile(fileId, apiKey) {
    const url = CONFIG.driveFilesUrl + encodeURIComponent(fileId) +
      '?alt=media&supportsAllDrives=true&key=' + encodeURIComponent(apiKey);
    log('GET ' + CONFIG.driveFilesUrl + encodeURIComponent(fileId) + ' ...');

    let response;
    try {
      // Explicit, so no inherited policy can strip the origin the key's
      // referrer restriction checks.
      response = await fetch(url, { referrerPolicy: 'strict-origin-when-cross-origin' });
    } catch (err) {
      // No readable response at all: offline, DNS or CORS.
      log('Request failed: ' + err.name + ': ' + err.message, 'err');
      throw new LoggedError('network');
    }

    log('HTTP ' + response.status + ' ' + (response.statusText || ''),
      response.ok ? 'ok' : 'err');

    if (!response.ok) {
      if (DEBUG) {
        let body = '';
        try { body = await response.text(); } catch (e) { body = '(unreadable)'; }
        log('Response body:\n' + body, 'err');
      }
      throw new LoggedError('http ' + response.status);
    }

    const total = Number(response.headers.get('content-length')) || 0;

    // Stream the body so the percentage can advance while it downloads.
    if (!response.body || !response.body.getReader) {
      const bytes = new Uint8Array(await response.arrayBuffer());
      log('Received ' + formatBytes(bytes.length) + ' (no stream support).', 'ok');
      return bytes;
    }

    const reader = response.body.getReader();
    const chunks = [];
    let received = 0;
    let lastPaint = 0;

    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      received += value.length;
      const now = performance.now();
      if (total && now - lastPaint > 100) {
        lastPaint = now;
        loadPercentEl.textContent =
          Math.min(100, Math.round(received / total * 100)) + '%';
      }
    }

    const bytes = new Uint8Array(received);
    let offset = 0;
    for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
    log('Received ' + formatBytes(bytes.length) + '.', 'ok');
    return bytes;
  }

  /* =========================================================================
     GLB PARSING AND DISPLAY
     ========================================================================= */
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath(DRACO_DECODER_PATH);
  const gltfLoader = new GLTFLoader();
  gltfLoader.setDRACOLoader(dracoLoader);
  gltfLoader.setMeshoptDecoder(MeshoptDecoder);

  // A binary glTF always starts with the ASCII magic "glTF". Anything else is
  // an HTML page or a JSON error that Drive returned with status 200.
  function checkGlbMagic(bytes) {
    if (bytes.length < 12) throw new LoggedError('too short');
    const magic = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
    if (magic !== 'glTF') {
      if (DEBUG) {
        const preview = new TextDecoder().decode(bytes.slice(0, 200))
          .replace(/[^\x20-\x7E\n]/g, '.');
        log('Not a GLB. First bytes:\n' + preview, 'err');
      }
      throw new LoggedError('not a glb');
    }
    log('Format: GLB.', 'ok');
  }

  function disposeModel(root) {
    root.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
  }

  function showModel(root) {
    if (currentModel) {
      scene.remove(currentModel);
      disposeModel(currentModel);
      currentModel = null;
    }

    // Replace every material with the active preset, and repair the two
    // things a geometry-only 3ds Max export often lacks.
    let meshCount = 0;
    let triangles = 0;
    root.traverse((o) => {
      if (!o.isMesh) return;
      meshCount++;
      const g = o.geometry;
      if (!g.attributes.normal) g.computeVertexNormals();
      triangles += (g.index ? g.index.count : g.attributes.position.count) / 3;
      const old = Array.isArray(o.material) ? o.material : [o.material];
      old.forEach((m) => { if (m && !Object.values(materials).includes(m)) m.dispose(); });
      o.material = materials[materialKey];
    });

    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root);
    if (box.isEmpty()) {
      log('No visible geometry (' + meshCount + ' meshes).', 'err');
      throw new LoggedError('empty model');
    }

    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    log('Meshes: ' + meshCount + ', triangles: ' + Math.round(triangles), 'ok');
    log('Size: ' + size.x.toFixed(3) + ' x ' + size.y.toFixed(3) + ' x ' + size.z.toFixed(3));

    // Center on the origin so orbiting feels right.
    root.position.sub(center);
    scene.add(root);
    currentModel = root;

    // Frame the bounding sphere, accounting for portrait screens where the
    // horizontal field of view is the limiting one.
    const radius = Math.max(size.length() / 2, 1e-6);
    const fovRad = THREE.MathUtils.degToRad(camera.fov);
    const fitFov = camera.aspect < 1
      ? 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect)
      : fovRad;
    const distance = (radius / Math.sin(fitFov / 2)) * CONFIG.camera.fitMargin;

    const dir = new THREE.Vector3().fromArray(CONFIG.camera.direction).normalize();
    camera.position.copy(dir.multiplyScalar(distance));
    camera.near = distance / 100;
    camera.far = distance * 100;
    camera.updateProjectionMatrix();

    controls.target.set(0, 0, 0);
    controls.minDistance = radius * 0.05;
    controls.maxDistance = distance * 10;
    controls.update();
  }

  /* =========================================================================
     LOAD FLOW
     ========================================================================= */
  const MESSAGES = {
    noModel: 'No model in this link. Please use the link you were sent.',
    failed: 'This model could not be loaded. Please try again.'
  };

  let loading = false;

  async function loadModel() {
    if (loading) return;
    loading = true;
    hideError();
    showLoading(true);

    try {
      const bytes = await fetchDriveFile(modelId, apiKey);
      checkGlbMagic(bytes);
      const gltf = await gltfLoader.parseAsync(bytes.buffer, '');
      showModel(gltf.scene);
      showLoading(false);
      log('Model displayed.', 'ok');
    } catch (err) {
      if (!(err instanceof LoggedError)) {
        log('Unexpected error: ' + (err && err.message ? err.message : String(err)), 'err');
        if (err && err.stack) log(err.stack, 'err');
      }
      showError(MESSAGES.failed);
    } finally {
      loading = false;
    }
  }

  /* =========================================================================
     SHARE
     The capture must stay synchronous. iOS Safari only allows
     navigator.share inside the gesture that triggered it, and an await
     before the call loses that permission, so the canvas is read with
     toDataURL instead of the asynchronous toBlob.
     ========================================================================= */

  // Renders one fresh frame and returns it as a data URL. Only the canvas is
  // read, so the buttons are never part of the image.
  function captureStill() {
    renderer.render(scene, camera);
    return canvas.toDataURL(CONFIG.share.mimeType, CONFIG.share.quality);
  }

  /* Strips parameters from a MIME type, leaving "video/mp4" from
     'video/mp4;codecs="avc1.42E01E,mp4a.40.2"'.

     This matters for sharing. Chromium's navigator.canShare only runs the
     renderer side checks, while the browser process applies its own allowlist
     and, when a file fails it, returns PERMISSION_DENIED which surfaces as
     NotAllowedError "Permission denied". Allowlists are keyed on plain MIME
     types, so a type carrying codec parameters can pass canShare and still be
     refused. Every File handed to the share sheet therefore gets a plain type.
     Measured on Samsung Internet 30: MediaRecorder reports
     video/mp4;codecs="avc1.42E01E,mp4a.40.2" and sharing that was refused. */
  function plainMimeType(type) {
    return String(type || '').split(';')[0].trim().toLowerCase();
  }

  /* Keeps the file name honest: the extension always matches the plain type.
     Both halves matter for the share sheet, which is keyed on them. */
  function extensionForType(type) {
    const map = {
      'video/mp4': '.mp4',
      'video/quicktime': '.mov',
      'video/webm': '.webm',
      'video/x-matroska': '.mkv',
      'image/jpeg': '.jpg',
      'image/png': '.png',
      'audio/mp4': '.m4a',
      'audio/webm': '.weba'
    };
    return map[plainMimeType(type)] || '';
  }

  function dataUrlToFile(dataUrl, name) {
    const comma = dataUrl.indexOf(',');
    const header = dataUrl.slice(0, comma);
    const mime = plainMimeType(header.slice(header.indexOf(':') + 1, header.indexOf(';')));
    const binary = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], name, { type: mime });
  }

  function downloadFile(file) {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    log('Shared by download instead.', 'ok');
  }

  /* Sends one file to the system share sheet, falling back to a download.
     Phase 3 reuses this unchanged for the recorded video. */
  function shareFile(file, onShared) {
    // Re-normalise here, because this is the single door every shared file goes
    // through, Phase 3's recorded video included.
    const plain = plainMimeType(file.type);
    if (plain && plain !== file.type) {
      log('Normalising share type: ' + file.type + ' -> ' + plain);
      file = new File([file], file.name, { type: plain });
    }

    const canShareFiles = typeof navigator.canShare === 'function' &&
      navigator.canShare({ files: [file] });

    if (!canShareFiles) {
      log('File sharing not supported; downloading.', 'err');
      downloadFile(file);
      return;
    }

    navigator.share({ files: [file] })
      .then(() => {
        log('Shared.', 'ok');
        if (onShared) onShared();
      })
      .catch((err) => {
        // The customer dismissing the sheet is not a failure.
        if (err && err.name === 'AbortError') { log('Share cancelled.'); return; }
        log('Share failed: ' + (err && err.message ? err.message : String(err)), 'err');
        downloadFile(file);
      });
  }

  function onShareClicked() {
    if (!currentModel) return;
    let file;
    try {
      file = dataUrlToFile(captureStill(), CONFIG.share.fileName);
    } catch (err) {
      log('Capture failed: ' + (err && err.message ? err.message : String(err)), 'err');
      return;
    }
    shareFile(file);
  }

  /* =========================================================================
     CLOSE
     window.close() only works for windows that a script opened, which is not
     the case when the customer taps a link. When it is refused the page turns
     into a plain end screen instead of appearing to do nothing.
     ========================================================================= */
  function onCloseClicked() {
    window.close();
    setTimeout(() => {
      if (currentScreen === 'main') showScreen('end');

  }
