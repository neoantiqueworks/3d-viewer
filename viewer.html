  // Path2D objects are reused rather than reparsed on every repaint.
  const iconPathCache = {};
  function iconPath(name) {
    if (!iconPathCache[name]) iconPathCache[name] = new Path2D(ICON_PATHS[name]);
    return iconPathCache[name];
  }

  // Reads one of the clamp() sized layout tokens as a number of CSS pixels.
  // getPropertyValue returns a custom property as written, so parsing it
  // directly turns clamp(), calc() and env() into NaN and every caller got the
  // fallback. A probe lets the browser resolve the length instead.
  let tokenProbe = null;
  function tokenPx(name, fallback) {
    if (!tokenProbe) {
      tokenProbe = document.createElement('div');
      tokenProbe.setAttribute('aria-hidden', 'true');
      tokenProbe.style.cssText =
        'position:fixed;left:0;top:0;height:0;visibility:hidden;pointer-events:none';
      document.body.appendChild(tokenProbe);
    }
    tokenProbe.style.width = 'var(' + name + ')';
    const value = tokenProbe.getBoundingClientRect().width;
    return isFinite(value) && value > 0 ? value : fallback;
  }

  /* Sizes a canvas to a CSS box in real device pixels and returns a context
     whose coordinates are CSS pixels, so the drawing code stays readable and
     the result stays sharp on a high density screen. */
  function prepareCanvas(canvas, cssWidth, cssHeight) {
    const ratio = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
    canvas.width = Math.max(1, Math.round(cssWidth * ratio));
    canvas.height = Math.max(1, Math.round(cssHeight * ratio));
    canvas.style.width = cssWidth + 'px';
    canvas.style.height = cssHeight + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, cssWidth, cssHeight);
    return ctx;
  }

  // Lightens (amount > 0) or darkens (amount < 0) a #rrggbb colour.
  function shade(hex, amount) {
    const n = parseInt(hex.slice(1), 16);
    const parts = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => {
      const next = amount >= 0 ? v + (255 - v) * amount : v * (1 + amount);
      return Math.max(0, Math.min(255, Math.round(next)));
    });
    return '#' + parts.map((v) => v.toString(16).padStart(2, '0')).join('');
  }

  // Draws the glyph of one icon, centred in a box of the given size.
  function drawGlyph(ctx, name, centreX, centreY, boxSize, color) {
    const scale = boxSize / 24;                      // icons use a 24 unit box
    ctx.save();
    ctx.translate(centreX - boxSize / 2, centreY - boxSize / 2);
    ctx.scale(scale, scale);
    ctx.fillStyle = color;
    ctx.fill(iconPath(name));
    ctx.restore();
  }

  /* An icon button: a disc in the brand colour with a white glyph on it. The
     two background buttons act as a pair, so the selected one also gets a ring.
     White on the brand colour measures 5.4 to 1, well past the 3 to 1 that a
     glyph needs, and it does not change between the light and dark themes
     because the disc colour is fixed. */
  function paintIconButton(host, iconName, selected) {
    const canvas = host.querySelector('canvas');
    if (!canvas) return;
    const size = tokenPx('--btn', 48);
    const ring = CONFIG.ui.ringWidth;
    const ctx = prepareCanvas(canvas, size, size);
    const centre = size / 2;
    const radius = centre - ring - 1;

    // Soft drop shadow so the control lifts off the 3D view.
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.arc(centre, centre, radius, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.ui.brandColor;
    ctx.fill();
    ctx.restore();

    // Hairline edge, so the disc still reads against a similar background.
    ctx.beginPath();
    ctx.arc(centre, centre, radius, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.30)';
    ctx.stroke();

    drawGlyph(ctx, iconName, centre, centre, size * CONFIG.ui.iconScale,
      CONFIG.ui.iconColor);

    if (selected) {
      // A light ring reads against the brand disc, which a brand ring would not.
      ctx.beginPath();
      ctx.arc(centre, centre, radius + ring * 0.6, 0, Math.PI * 2);
      ctx.lineWidth = ring;
      ctx.strokeStyle = CONFIG.ui.selectedRing;
      ctx.stroke();
    }
  }

  /* A material swatch: the material's own colour, with the brand colour as the
     selected ring. spec is either a colour string or a { top, bottom } pair,
     which is how the two background gradients would be drawn if they were ever
     shown as swatches again. */
  function paintSwatch(host, spec, selected) {
    const canvas = host.querySelector('canvas');
    if (!canvas) return;
    const size = tokenPx('--swatch', 44);
    const ring = CONFIG.ui.ringWidth;
    const ctx = prepareCanvas(canvas, size, size);
    const centre = size / 2;
    const radius = centre - ring - 1;

    let fill;
    if (spec && typeof spec === 'object') {
      fill = ctx.createLinearGradient(0, centre - radius, 0, centre + radius);
      fill.addColorStop(0, spec.top);
      fill.addColorStop(1, spec.bottom);
    } else {
      fill = spec;
    }

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.arc(centre, centre, radius, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(centre, centre, radius, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.stroke();

    if (selected) {
      ctx.beginPath();
      ctx.arc(centre, centre, radius + ring * 0.6, 0, Math.PI * 2);
      ctx.lineWidth = ring;
      ctx.strokeStyle = CONFIG.ui.brandColor;
      ctx.stroke();
    }
  }

  /* The loading spinner, drawn rather than animated in CSS so a forced dark
     mode cannot recolour it. The percentage comes from the same element the
     Drive fetch already writes to, which stays in the DOM for screen readers
     while the visible copy is painted here. */
  let spinnerFrame = null;
  let spinnerStarted = 0;

  function paintSpinner() {
    const canvas = document.getElementById('spinnerCanvas');
    if (!canvas) return;
    const size = CONFIG.ui.spinnerSize;
    const ctx = prepareCanvas(canvas, size, size + 18);
    const centre = size / 2;
    const radius = centre - 4;
    const angle = ((performance.now() - spinnerStarted) / 1000) * Math.PI * 1.6;

    // Track.
    ctx.beginPath();
    ctx.arc(centre, centre, radius, 0, Math.PI * 2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = CONFIG.ui.spinnerTrack;
    ctx.stroke();

    // Moving arc.
    ctx.beginPath();
    ctx.arc(centre, centre, radius, angle, angle + Math.PI * 0.6);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = CONFIG.ui.brandColor;
    ctx.stroke();

    // Percentage, when the download reported a size.
    const text = loadPercentEl ? loadPercentEl.textContent : '';
    if (text) {
      ctx.fillStyle = CONFIG.ui.spinnerText;
      ctx.font = '600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(text, centre, size + 2);
    }
  }

  function startSpinner() {
    if (spinnerFrame !== null) return;
    spinnerStarted = performance.now();
    const tick = () => {
      paintSpinner();
      spinnerFrame = requestAnimationFrame(tick);
    };
    tick();
  }

  function stopSpinner() {
    if (spinnerFrame === null) return;
    cancelAnimationFrame(spinnerFrame);
    spinnerFrame = null;
  }

  /* The record button. A brand disc with a microphone while idle, a red disc
     with a stop square while recording, and the elapsed time above it so the
     customer can see a recording is running. The timer strip is part of the
     button's own box (see #editUi .recordBtn), so it cannot overlap anything. A disabled state is drawn flat and
     grey for when the microphone or the recorder is unavailable. */
  function paintRecordButton(host, state, seconds) {
    const canvasEl = host.querySelector('canvas');
    if (!canvasEl) return;
    const size = tokenPx('--btn', 48);
    const strip = 16;                                // timer strip above the disc
    const ctx = prepareCanvas(canvasEl, size, size + strip);
    const centre = size / 2;
    const radius = centre - 2;
    const cy = strip + centre;                       // disc centre

    const recording = state === 'recording';
    const disabled = state === 'disabled';

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.38)';
    ctx.shadowBlur = 6;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.arc(centre, cy, radius, 0, Math.PI * 2);
    ctx.fillStyle = disabled ? 'rgba(128, 128, 128, 0.55)'
      : recording ? CONFIG.edit.recordingDisc
      : CONFIG.ui.brandColor;
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(centre, cy, radius, 0, Math.PI * 2);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.30)';
    ctx.stroke();

    drawGlyph(ctx, recording ? 'stop' : 'mic', centre, cy,
      size * CONFIG.ui.iconScale,
      disabled ? 'rgba(255, 255, 255, 0.65)' : CONFIG.ui.iconColor);

    // A slash over the microphone says "unavailable" without any text.
    if (disabled) {
      ctx.beginPath();
      ctx.moveTo(centre - radius * 0.5, cy + radius * 0.5);
      ctx.lineTo(centre + radius * 0.5, cy - radius * 0.5);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
    }

    if (recording) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      const label = mins + ':' + String(secs).padStart(2, '0');
      ctx.fillStyle = CONFIG.edit.recordingDisc;
      ctx.font = '700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, centre, strip / 2);
    }
  }

  /* A message screen: background gradient, wrapped message and a pill button,
     all painted into one canvas. The real button is then positioned over the
     painted pill using the same numbers, so artwork and hit area cannot drift
     apart. Returns nothing; it moves the button itself. */
  function paintMessageScreen(canvasId, textId, button, label) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const width = window.innerWidth;
    const height = window.innerHeight;
    const ctx = prepareCanvas(canvas, width, height);
    const spec = CONFIG.background[backgroundKey];
    const dark = backgroundKey === 'dark';

    // Same gradient as the viewer background, so the screen does not introduce
    // a third look.
    const gradient = ctx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, spec.top);
    gradient.addColorStop(1, spec.bottom);
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, width, height);

    // Message, wrapped to a comfortable measure and centred.
    const source = document.getElementById(textId);
    const message = source ? source.textContent.trim() : '';
    const fontSize = Math.max(15, Math.min(18, width / 22));
    ctx.font = '400 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = dark ? CONFIG.ui.textOnDark : CONFIG.ui.textOnLight;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const maxWidth = Math.min(width - 48, 20 * fontSize);
    const words = message.split(/\s+/);
    const lines = [];
    let line = '';
    for (const word of words) {
      const candidate = line ? line + ' ' + word : word;
      if (ctx.measureText(candidate).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    }
    if (line) lines.push(line);

    const lineHeight = fontSize * 1.45;
    const blockHeight = lines.length * lineHeight;
    const pillHeight = Math.max(44, fontSize * 2.8);
    const gap = 26;
    const totalHeight = blockHeight + gap + pillHeight;
    let y = height / 2 - totalHeight / 2 + lineHeight / 2;

    for (const text of lines) {
      ctx.fillText(text, width / 2, y);
      y += lineHeight;
    }

    // Pill button in the brand colour, with its label.
    ctx.font = '600 ' + fontSize + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    const pillWidth = Math.min(width - 64, ctx.measureText(label).width + fontSize * 3.2);
    const pillX = width / 2 - pillWidth / 2;
    const pillY = height / 2 - totalHeight / 2 + blockHeight + gap;
    const pillRadius = pillHeight / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 2;
    ctx.beginPath();
    ctx.moveTo(pillX + pillRadius, pillY);
    ctx.arcTo(pillX + pillWidth, pillY, pillX + pillWidth, pillY + pillHeight, pillRadius);
    ctx.arcTo(pillX + pillWidth, pillY + pillHeight, pillX, pillY + pillHeight, pillRadius);
    ctx.arcTo(pillX, pillY + pillHeight, pillX, pillY, pillRadius);
    ctx.arcTo(pillX, pillY, pillX + pillWidth, pillY, pillRadius);
    ctx.closePath();
    ctx.fillStyle = CONFIG.ui.brandColor;
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = CONFIG.ui.iconColor;
    ctx.textBaseline = 'middle';
    ctx.fillText(label, width / 2, pillY + pillHeight / 2 + 1);

    // Put the real control exactly over the painted pill.
    if (button) {
      button.style.left = pillX + 'px';
      button.style.top = pillY + 'px';
      button.style.width = pillWidth + 'px';
      button.style.height = pillHeight + 'px';
    }
  }

  /* Repaints every control. Called whenever the state or the viewport changes,
     because the clamp() sized tokens change with viewport width. */
  function repaintControls() {
    paintIconButton(bgButtons.light, 'sunny', backgroundKey === 'light');
    paintIconButton(bgButtons.dark, 'moon', backgroundKey === 'dark');
    paintIconButton(document.getElementById('closeBtn'), 'close', false);
    paintIconButton(document.getElementById('shareBtn'), 'share', false);
    paintIconButton(document.getElementById('editBtn'), 'edit', false);
    for (const key of MATERIAL_KEYS) {
      paintSwatch(materialButtons[key], CONFIG.materials[key].swatch, materialKey === key);
    }
  }

  // Only the visible message screen needs repainting.
  function repaintOverlays() {
    if (!errorEl.hidden) {
      paintMessageScreen('errorCanvas', 'errorText',
        document.getElementById('retryBtn'), CONFIG.ui.retryLabel);
    }
    if (!endScreenEl.hidden) {
      paintMessageScreen('endCanvas', 'endText',
        document.getElementById('reopenBtn'), CONFIG.ui.reopenLabel);
    }
  }

  function repaintUi() {
    repaintControls();
    repaintOverlays();
    if (currentScreen === 'edit') repaintEditControls();
  }

  /* =========================================================================
     EDIT SCREEN (Phase 3)

     Lives in this same page: showScreen('edit') swaps to it, nothing navigates.

     One canvas holds the frozen view and every stroke, because captureStream
     records a single canvas and the video has to contain both. Strokes are kept
     as data rather than pixels, so Undo is a pop and the whole thing is
     redrawn from the still each time.

     Recording copies that canvas into a smaller one each frame. Two reasons:
     the recorded size is capped so the encoder and the file stay reasonable,
     and a canvas that is never drawn to can stop producing frames for
     captureStream, which a static annotated image would otherwise do.

     The file is finalized when Stop is tapped, not when Share is. That is what
     lets Share call navigator.share synchronously inside the tap, which iOS
     Safari requires and which cannot be done after awaiting a recorder stop.
     ========================================================================= */

  const editScreenEl = document.getElementById('editScreen');
  const editCanvas = document.getElementById('editCanvas');
  const editCtx = editCanvas.getContext('2d');
  const penColorRow = document.getElementById('penColorRow');

  // The frozen frame, captured on entry at the full canvas resolution.
  let editStill = null;

  /* Strokes are stored in NORMALISED coordinates, 0 to 1 of the canvas, so a
     rotation or a resize replays them in the right place. */
  let strokes = [];
  let activeStroke = null;
  let penColor = CONFIG.edit.penColors[0];

  // Recording state.
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordedFile = null;
  let micStream = null;
  let recordUnavailable = false;   // mic denied, or no supported video type
  let recordCanvas = null;
  let recordFrame = null;
  let recordTimer = null;
  let recordStartedAt = 0;

  /* ---- Entering and leaving ---------------------------------------------- */

  function openEditScreen() {
    if (!currentModel) return;

    // Render one frame and freeze it, gradient background included, at the
    // exact buffer size so nothing is resampled on the way in.
    renderer.render(scene, camera);
    editStill = document.createElement('canvas');
    editStill.width = canvas.width;
    editStill.height = canvas.height;
    editStill.getContext('2d').drawImage(canvas, 0, 0);

    strokes = [];
    activeStroke = null;
    recordedFile = null;
    hidePenColorRow();

    controls.enabled = false;        // orbit is off while editing
    showScreen('edit');
    layoutEditCanvas();
    redrawEdit();
    log('Edit screen opened. Still ' + editStill.width + ' x ' + editStill.height);
  }

  /* Close discards the recording and the strokes, so re-entering Edit always
     starts from a fresh capture of the current view. */
  function closeEditScreen() {
    if (isRecording()) stopRecording();
    releaseMic();
    strokes = [];
    activeStroke = null;
    recordedChunks = [];
    recordedFile = null;
    editStill = null;
    hidePenColorRow();

    controls.enabled = true;
    showScreen('main');
    log('Edit screen closed; strokes and recording discarded.');
  }

  /* ---- Canvas layout and drawing ----------------------------------------- */

  // The canvas always covers the viewport, so pointer coordinates map directly.
  function layoutEditCanvas() {
    const ratio = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
    editCanvas.width = Math.round(window.innerWidth * ratio);
    editCanvas.height = Math.round(window.innerHeight * ratio);
    editCanvas.style.width = window.innerWidth + 'px';
    editCanvas.style.height = window.innerHeight + 'px';
    editCanvas.style.left = '0px';
    editCanvas.style.top = '0px';
  }

  /* Redraws from scratch: background, the frozen still fitted inside it, then
     every stroke replayed. Called on every change, which is what makes Undo and
     Clear trivial. */
  function redrawEdit() {
    if (!editStill) return;
    const width = editCanvas.width;
    const height = editCanvas.height;

    // The same gradient as the viewer, so any letterboxing after a rotation
    // looks deliberate rather than broken.
    const spec = CONFIG.background[backgroundKey];
    const gradient = editCtx.createLinearGradient(0, 0, 0, height);
    gradient.addColorStop(0, spec.top);
    gradient.addColorStop(1, spec.bottom);
    editCtx.setTransform(1, 0, 0, 1, 0, 0);
    editCtx.fillStyle = gradient;
    editCtx.fillRect(0, 0, width, height);

    // Fit the still, preserving its aspect.
    const scale = Math.min(width / editStill.width, height / editStill.height);
    const drawWidth = editStill.width * scale;
    const drawHeight = editStill.height * scale;
    editCtx.drawImage(editStill, (width - drawWidth) / 2, (height - drawHeight) / 2,
      drawWidth, drawHeight);

    // Replay the strokes.
    const penScale = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
    editCtx.lineCap = 'round';
    editCtx.lineJoin = 'round';
    for (const stroke of strokes.concat(activeStroke ? [activeStroke] : [])) {
      if (stroke.points.length === 0) continue;
      editCtx.strokeStyle = stroke.color;
      editCtx.lineWidth = stroke.width * penScale;
      editCtx.beginPath();

      const first = stroke.points[0];
      editCtx.moveTo(first.x * width, first.y * height);
      if (stroke.points.length === 1) {
        // A tap with no movement still leaves a dot.
        editCtx.lineTo(first.x * width + 0.01, first.y * height);
      } else {
        // Curve through the midpoints, which smooths a shaky finger.
        for (let i = 1; i < stroke.points.length - 1; i++) {
          const a = stroke.points[i];
          const b = stroke.points[i + 1];
          editCtx.quadraticCurveTo(a.x * width, a.y * height,
            (a.x + b.x) / 2 * width, (a.y + b.y) / 2 * height);
        }
        const last = stroke.points[stroke.points.length - 1];
        editCtx.lineTo(last.x * width, last.y * height);
      }
      editCtx.stroke();
    }
  }

  /* ---- Pointer drawing --------------------------------------------------- */

  function pointFromEvent(event) {
    const rect = editCanvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) / rect.width,
      y: (event.clientY - rect.top) / rect.height
    };
  }

  editCanvas.addEventListener('pointerdown', (event) => {
    if (currentScreen !== 'edit') return;
    hidePenColorRow();
    editCanvas.setPointerCapture(event.pointerId);
    activeStroke = { color: penColor, width: CONFIG.edit.penWidth, points: [pointFromEvent(event)] };
    redrawEdit();
  });

  editCanvas.addEventListener('pointermove', (event) => {
    if (!activeStroke) return;
    activeStroke.points.push(pointFromEvent(event));
    redrawEdit();
  });

  function endStroke() {
    if (!activeStroke) return;
    if (activeStroke.points.length > 0) strokes.push(activeStroke);
    activeStroke = null;
    redrawEdit();
    repaintEditControls();      // Undo and Clear become meaningful
  }
  editCanvas.addEventListener('pointerup', endStroke);
  editCanvas.addEventListener('pointercancel', endStroke);

  /* ---- Pen colour row ---------------------------------------------------- */

  // Built from CONFIG so the colour list is defined in exactly one place.
  function buildPenColorRow() {
    for (const color of CONFIG.edit.penColors) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'swatch penColorSwatch';
      button.setAttribute('aria-label', 'Pen colour ' + color);
      button.appendChild(document.createElement('canvas'));
      button.addEventListener('click', () => {
        penColor = color;
        hidePenColorRow();
        repaintEditControls();
        log('Pen colour: ' + color);
      });
      penColorRow.appendChild(button);
    }
  }

  function showPenColorRow() {
    penColorRow.hidden = false;
    document.getElementById('penColorBtn').setAttribute('aria-expanded', 'true');
    repaintPenColorRow();
    positionPenColorRow();
  }

  function hidePenColorRow() {
    penColorRow.hidden = true;
    const button = document.getElementById('penColorBtn');
    if (button) button.setAttribute('aria-expanded', 'false');
  }

  /* Placed from the colour button's own rect, so adding another tool to the
     column cannot put the row in the wrong place. The row opens to the right
     of the button, level with it. Where that would run past the right edge
     (six swatches next to the column do not fit on a 320 px phone) it opens
     directly above the button instead. Either way it is clamped inside the
     same safe-area edges the bars use, so it is always fully on screen. */
  function positionPenColorRow() {
    if (penColorRow.hidden) return;
    const anchor = document.getElementById('penColorBtn').getBoundingClientRect();
    const gap = tokenPx('--group-gap', 8);
    const minLeft = tokenPx('--edge-left', 8);
    const maxRight = window.innerWidth - tokenPx('--edge-right', 8);
    const minTop = tokenPx('--edge-top', 8);
    const maxBottom = window.innerHeight - tokenPx('--edge-bottom', 8);
    const width = penColorRow.offsetWidth;
    const height = penColorRow.offsetHeight;

    let left = anchor.right + gap;
    let top = anchor.top + (anchor.height - height) / 2;
    if (left + width > maxRight) {
      left = anchor.left;
      top = anchor.top - gap - height;
    }
    left = Math.max(minLeft, Math.min(left, maxRight - width));
    top = Math.max(minTop, Math.min(top, maxBottom - height));
    penColorRow.style.bottom = '';
    penColorRow.style.left = left + 'px';
    penColorRow.style.top = top + 'px';
  }

  function repaintPenColorRow() {
    const buttons = penColorRow.querySelectorAll('.penColorSwatch');
    CONFIG.edit.penColors.forEach((color, index) => {
      if (buttons[index]) paintSwatch(buttons[index], color, color === penColor);
    });
  }

  /* ---- Recorder format selection ----------------------------------------- */

  /* Walks CONFIG.edit.videoTypes and returns the first the browser will record.
     Returns null when none works, which is what puts the record button into its
     disabled state and leaves image sharing as the only option. */
  function pickVideoType() {
    if (typeof window.MediaRecorder === 'undefined') {
      log('MediaRecorder is unavailable; video recording is not possible.', 'err');
      return null;
    }
    if (typeof MediaRecorder.isTypeSupported !== 'function') {
      log('isTypeSupported is unavailable; letting the browser choose.', 'err');
      return '';
    }
    for (const type of CONFIG.edit.videoTypes) {
      if (MediaRecorder.isTypeSupported(type)) {
        log('Recorder type chosen: ' + type, 'ok');
        return type;
      }
      log('  not supported: ' + type);
    }
    log('No supported video type; image sharing only.', 'err');
    return null;
  }

  /* ---- Recording --------------------------------------------------------- */

  function isRecording() {
    return mediaRecorder !== null && mediaRecorder.state === 'recording';
  }

  // Even dimensions, long side capped. H.264 encoders commonly require even.
  function computeRecordSize(width, height) {
    const cap = CONFIG.edit.recordLongSide;
    const scale = Math.min(1, cap / Math.max(width, height));
    const even = (value) => Math.max(2, Math.round(value * scale / 2) * 2);
    return { width: even(width), height: even(height) };
  }

  async function startRecording() {
    if (isRecording() || recordUnavailable) return;

    const type = pickVideoType();
    if (type === null) {
      recordUnavailable = true;
      repaintEditControls();
      return;
    }

    // The microphone is asked for here, on the first tap of the record button,
    // and never before.
    if (!micStream) {
      try {
        log('Requesting the microphone...');
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const track = micStream.getAudioTracks()[0];
        log('Microphone granted' + (track ? ': ' + (track.label || 'unnamed') : ''), 'ok');
        if (track && track.getSettings) log('  track settings: ' + JSON.stringify(track.getSettings()));
      } catch (err) {
        // Denied is a dead end until the customer changes a system setting, so
        // the button says so and drawing plus image sharing carry on working.
        log('Microphone denied or unavailable: ' + err.name + ': ' + err.message, 'err');
        recordUnavailable = true;
        repaintEditControls();
        return;
      }
    }

    // A capped copy of the edit canvas is what actually gets recorded.
    const size = computeRecordSize(editCanvas.width, editCanvas.height);
    recordCanvas = document.createElement('canvas');
    recordCanvas.width = size.width;
    recordCanvas.height = size.height;
    const recordCtx = recordCanvas.getContext('2d');
    log('Recording canvas: ' + size.width + ' x ' + size.height +
      ' (display is ' + editCanvas.width + ' x ' + editCanvas.height +
      ', capped at ' + CONFIG.edit.recordLongSide + ')');

    let stream;
    try {
      stream = recordCanvas.captureStream(CONFIG.edit.recordFps);
    } catch (err) {
      log('captureStream failed: ' + err.name + ': ' + err.message, 'err');
      recordUnavailable = true;
      repaintEditControls();
      return;
    }

    const tracks = stream.getVideoTracks().concat(micStream.getAudioTracks());
    let combined;
    try {
      combined = new MediaStream(tracks);
    } catch (err) {
      log('Could not combine tracks: ' + err.message, 'err');
      return;
    }

    try {
      mediaRecorder = type ? new MediaRecorder(combined, { mimeType: type })
        : new MediaRecorder(combined);
    } catch (err) {
      log('MediaRecorder rejected ' + type + ': ' + err.message, 'err');
      try {
        mediaRecorder = new MediaRecorder(combined);
      } catch (err2) {
        log('MediaRecorder could not be created: ' + err2.message, 'err');
        recordUnavailable = true;
        repaintEditControls();
        return;
      }
    }

    // A new recording replaces the previous one.
    recordedChunks = [];
    recordedFile = null;
    log('Recorder mimeType (actual): ' + mediaRecorder.mimeType, 'ok');

    mediaRecorder.ondataavailable = (event) => {
      if (event.data && event.data.size > 0) recordedChunks.push(event.data);
    };
    mediaRecorder.onerror = (event) => {
      log('Recorder error: ' + (event.error ? event.error.name : 'unknown'), 'err');
    };
    mediaRecorder.onstop = finishRecording;

    // Copying the edit canvas every frame keeps the stream producing frames
    // even when nothing is being drawn, and carries any new strokes into it.
    const pump = () => {
      if (!recordCanvas) return;
      recordCtx.drawImage(editCanvas, 0, 0, recordCanvas.width, recordCanvas.height);
      recordFrame = requestAnimationFrame(pump);
    };
    pump();

    recordStartedAt = performance.now();
    mediaRecorder.start();

    // The timer redraws the button, and enforces the configured maximum.
    recordTimer = setInterval(() => {
      const seconds = (performance.now() - recordStartedAt) / 1000;
      if (seconds >= CONFIG.edit.maxRecordSeconds) {
        log('Maximum recording length reached (' + CONFIG.edit.maxRecordSeconds + ' s).');
        stopRecording();
        return;
      }
      repaintEditControls();
    }, 250);

    repaintEditControls();
    log('Recording started.', 'ok');
  }

  function stopRecording() {
    if (recordTimer) { clearInterval(recordTimer); recordTimer = null; }
    if (recordFrame !== null) { cancelAnimationFrame(recordFrame); recordFrame = null; }
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  }

  /* Builds the file here, on stop, so it is ready before Share is tapped. The
     type is plain and the extension matches it. */
  function finishRecording() {
    const seconds = (performance.now() - recordStartedAt) / 1000;
    const actualType = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
    const plain = plainMimeType(actualType);
    const blob = new Blob(recordedChunks, { type: plain });
    recordCanvas = null;

    if (blob.size === 0) {
      log('The recording came out empty; nothing reached the recorder.', 'err');
      recordedFile = null;
    } else {
      recordedFile = new File([blob], CONFIG.edit.fileBase + extensionForType(plain),
        { type: plain });
      log('Recording finished: ' + recordedFile.name + ', ' + plain + ', ' +
        formatBytes(recordedFile.size) + ', ' + seconds.toFixed(1) + ' s', 'ok');
      log('  recorder reported ' + actualType + ', normalised to ' + plain);
    }

    releaseMic();
    repaintEditControls();
  }

  // The microphone must be released or the phone keeps its recording indicator.
  function releaseMic() {
    if (!micStream) return;
    micStream.getTracks().forEach((track) => track.stop());
    micStream = null;
    log('Microphone released.');
  }

  /* ---- Sharing from the edit screen -------------------------------------- */

  /* The video when one exists, otherwise the annotated image at full display
     resolution. Both go through shareFile, which normalises the type again.
     Sharing changes nothing here: the screen stays open and the recording is
     kept, so it can be sent more than once. Only Close discards it. */
  function onEditShareClicked() {
    if (recordedFile) {
      log('Sharing the recording: ' + recordedFile.name + ', ' +
        formatBytes(recordedFile.size));
      logShareContext();
      shareFile(recordedFile);
      return;
    }

    let file;
    try {
      const dataUrl = editCanvas.toDataURL(CONFIG.edit.imageType, CONFIG.edit.imageQuality);
      file = dataUrlToFile(dataUrl, CONFIG.edit.fileBase + extensionForType(CONFIG.edit.imageType));
    } catch (err) {
      log('Could not capture the annotated image: ' + err.message, 'err');
      return;
    }
    log('Sharing the annotated image: ' + file.name + ', ' + file.type + ', ' +
      formatBytes(file.size) + ', ' + strokes.length + ' stroke(s)');
    logShareContext();
    shareFile(file);
  }

  // Activation state at the moment of the call, which is what distinguishes a
  // gesture problem from a file problem if a share is ever refused again.
  function logShareContext() {
    if (!DEBUG) return;
    const activation = navigator.userActivation;
    if (activation) {
      log('  userActivation.isActive: ' + activation.isActive +
        ', hasBeenActive: ' + activation.hasBeenActive);
    }
  }

  /* ---- Edit screen controls ---------------------------------------------- */

  function recordButtonState() {
    if (recordUnavailable) return 'disabled';
    return isRecording() ? 'recording' : 'idle';
  }

  function repaintEditControls() {
    paintIconButton(document.getElementById('editCloseBtn'), 'close', false);
    paintIconButton(document.getElementById('penBtn'), 'pen', true);
    paintIconButton(document.getElementById('undoBtn'), 'undo', false);
    paintIconButton(document.getElementById('clearBtn'), 'clear', false);
    paintIconButton(document.getElementById('editShareBtn'), 'share', false);

    // The colour button previews the current pen colour as its ring.
    paintIconButton(document.getElementById('penColorBtn'), 'color', false);
    paintPenColorIndicator();

    const seconds = isRecording() ? (performance.now() - recordStartedAt) / 1000 : 0;
    paintRecordButton(document.getElementById('recordBtn'), recordButtonState(), seconds);

    if (!penColorRow.hidden) { repaintPenColorRow(); positionPenColorRow(); }
  }

  /* A ring in the current pen colour around the colour button, so the active
     colour is visible without opening the row. */
  function paintPenColorIndicator() {
    const host = document.getElementById('penColorBtn');
    const canvasEl = host.querySelector('canvas');
    if (!canvasEl) return;
    const size = tokenPx('--btn', 48);
    const ctx = canvasEl.getContext('2d');
    const ring = CONFIG.ui.ringWidth;
    const centre = size / 2;
    ctx.beginPath();
    ctx.arc(centre, centre, centre - ring - 1 + ring * 0.6, 0, Math.PI * 2);
    ctx.lineWidth = ring;
    ctx.strokeStyle = penColor;
    ctx.stroke();
  }

  /* ---- Wiring ------------------------------------------------------------ */

  document.getElementById('editBtn').addEventListener('click', openEditScreen);
  document.getElementById('editCloseBtn').addEventListener('click', closeEditScreen);
  document.getElementById('editShareBtn').addEventListener('click', onEditShareClicked);

  document.getElementById('penBtn').addEventListener('click', () => {
    hidePenColorRow();          // the pen is the only tool, so this just closes the row
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    if (strokes.length === 0) return;
    strokes.pop();
    redrawEdit();
    repaintEditControls();
    log('Undo; ' + strokes.length + ' stroke(s) left.');
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    if (strokes.length === 0) return;
    log('Cleared ' + strokes.length + ' stroke(s).');
    strokes = [];
    activeStroke = null;
    redrawEdit();
    repaintEditControls();
  });

  document.getElementById('penColorBtn').addEventListener('click', () => {
    if (penColorRow.hidden) showPenColorRow(); else hidePenColorRow();
  });

  document.getElementById('recordBtn').addEventListener('click', () => {
    if (isRecording()) stopRecording(); else startRecording();
  });

  buildPenColorRow();

  // A recording must not outlive the page.
  window.addEventListener('pagehide', () => {
    if (isRecording()) stopRecording();
    releaseMic();
  });

  /* =========================================================================
     UI WIRING
     ========================================================================= */
  const materialButtons = {
    chrome: document.getElementById('matChrome'),
    bronze: document.getElementById('matBronze'),
    anthracite: document.getElementById('matAnthracite')
  };
  const bgButtons = {
    light: document.getElementById('bgLight'),
    dark: document.getElementById('bgDark')
  };

  // The swatch buttons take their color from CONFIG so a tweak there shows up
  // on the button too.
  for (const key of MATERIAL_KEYS) {
    materialButtons[key].addEventListener('click', () => applyMaterial(key));
  }
  // Both background buttons are painted icon buttons, so only the handler is
  // wired; repaintControls() supplies the artwork and the selected ring.
  for (const key of BACKGROUND_KEYS) {
    bgButtons[key].addEventListener('click', () => applyBackground(key));
  }

  document.getElementById('shareBtn').addEventListener('click', onShareClicked);
  document.getElementById('closeBtn').addEventListener('click', onCloseClicked);
  document.getElementById('retryBtn').addEventListener('click', loadModel);
  document.getElementById('reopenBtn').addEventListener('click', () => showScreen('main'));

  /* =======================================================================
     SELF-UPDATE CHECK

     GitHub Pages sends Cache-Control: max-age=600 and that header cannot be
     changed, while Samsung Internet holds pages for longer still, so a phone can
     keep showing an old build after a deploy. This asks the server which version
     is current and reloads once if this page is behind.

     version.json is fetched with cache 'no-store' AND a unique timestamp in the
     query string, because either one alone has been seen to be ignored.

     The loop guard is the _v parameter in the URL. A reload happens only when _v
     is absent or carries a DIFFERENT version from the one just fetched, so:
       - each version causes at most one reload;
       - a page still stale after its reload (a cache that will not let go)
         carries on rather than looping;
       - a bookmarked link holding an old _v still updates, because _v is
         compared against the fetched version rather than merely tested for
         presence.

     Anything unexpected means carrying on with the page as it is: a failed
     fetch, a timeout, an empty file. The check never blocks what the page is
     doing; it is started alongside the main work and only interrupts to reload.

     const is used here rather than this file's usual var so the block can stay
     byte-identical across all three pages.
     ======================================================================= */
  const VERSION_FILE = 'version.json';
  const VERSION_PARAM = '_v';
  const VERSION_TIMEOUT_MS = 2000;

  function checkForNewVersion(pageVersion, logLine) {
    const requestUrl = VERSION_FILE + '?t=' + Date.now();
    const controller = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(function () {
      if (controller) controller.abort();
    }, VERSION_TIMEOUT_MS);

    fetch(requestUrl, {
      cache: 'no-store',
      signal: controller ? controller.signal : undefined
    }).then(function (response) {
      clearTimeout(timer);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.text();
    }).then(function (text) {
      // Tolerant parse: accepts the version with or without JSON quotes.
      const latest = text.trim().replace(/^"/, '').replace(/"$/, '').trim();
      logLine('version check: page ' + pageVersion + ', server ' + (latest || '(empty)'));

      if (!latest) {
        logLine('version check: empty version file, continuing');
        return;
      }
      if (latest === pageVersion) {
        logLine('version check: up to date');
        return;
      }

      const target = new URL(location.href);
      if (target.searchParams.get(VERSION_PARAM) === latest) {
        logLine('version check: already reloaded for ' + latest +
          ' and still stale, continuing');
        return;
      }

      logLine('version check: stale, reloading once with ' + VERSION_PARAM + '=' + latest);
      target.searchParams.set(VERSION_PARAM, latest);
      // replace, not assign, so Back does not bounce through the stale copy.
      location.replace(target.toString());
    }).catch(function (err) {
      clearTimeout(timer);
      logLine('version check: skipped (' + (err && err.name ? err.name : 'error') + ')');
    });
  }

  /* =========================================================================
     STARTUP
     ========================================================================= */
  window.__viewerReady = true;   // tells the watchdog three.js arrived
  // Lets tests/harness.html switch screens exactly as the app does.
  window.__viewerShowScreen = showScreen;

  /* Everything needed to tell apart the ways this page can look wrong on a
     device with no reachable console. Only runs with the log panel on. */
  function logDiagnostics() {
    if (!DEBUG) return;

    log('--- diagnostics ---');
    log('viewer version: ' + VIEWER_VERSION);
    log('three.js: r' + THREE.REVISION);
    log('url: ' + location.href);
    log('browser: ' + browserName());
    log('forces dark CSS colours: ' + forcesDarkColors() +
      (forcesDarkColors() ? '  (controls are painted on canvas, which is immune)' : ''));
    log('user agent: ' + navigator.userAgent);

    // Display and canvas geometry.
    log('device pixel ratio: ' + window.devicePixelRatio +
      ' (renderer is capped at ' + CONFIG.maxPixelRatio + ')');
    log('window: ' + window.innerWidth + ' x ' + window.innerHeight + ' css px');
    log('canvas css: ' + canvas.clientWidth + ' x ' + canvas.clientHeight);
    log('canvas buffer: ' + canvas.width + ' x ' + canvas.height);

    // Color pipeline. If the background ever looks wrong, this is where the
    // answer is: output color space, tone mapping, and crucially whether tone
    // mapping is applied to the BACKGROUND, which three.js decides from the
    // background texture's color space.
    log('ColorManagement.enabled: ' + THREE.ColorManagement.enabled);
    log('renderer.outputColorSpace: ' + renderer.outputColorSpace);
    log('renderer.toneMapping: ' + toneMappingName(renderer.toneMapping) +
      ', exposure ' + renderer.toneMappingExposure);

    const activeTexture = backgroundTextures[backgroundKey];
    let backgroundToneMapped = '(could not determine)';
    try {
      // The exact expression three.js uses for the background material.
      backgroundToneMapped = String(
        THREE.ColorManagement.getTransfer(activeTexture.colorSpace) !== THREE.SRGBTransfer);
    } catch (err) {
      backgroundToneMapped = 'error: ' + err.message;
    }
    log('background texture colorSpace: ' + activeTexture.colorSpace);
    log('background tone mapped: ' + backgroundToneMapped + '  (false is correct)');

    // Which background is actually active, and with which colors.
    const spec = CONFIG.background[backgroundKey];
    log('active material: ' + materialKey + ' (' + CONFIG.materials[materialKey].label + ')');
    log('active background: ' + backgroundKey +
      '  top ' + spec.top + '  bottom ' + spec.bottom);
    log('bg came from: ' + (backgroundExplicit
      ? 'the bg URL parameter'
      : 'the material default for ' + materialKey));

    // Did the CSS variables actually take? These drive the overlay screens.
    const rootStyle = getComputedStyle(document.documentElement);
    log('css --bg-top: ' + rootStyle.getPropertyValue('--bg-top').trim() +
      ', --bg-bottom: ' + rootStyle.getPropertyValue('--bg-bottom').trim());
    log('css --btn: ' + rootStyle.getPropertyValue('--btn').trim() +
      ', --swatch: ' + rootStyle.getPropertyValue('--swatch').trim() +
      ', --gap: ' + rootStyle.getPropertyValue('--gap').trim());

    // A dark system theme is what makes Android Chrome want to auto-darken the
    // page. The color-scheme meta tag is what stops it; if this says true and
    // the CSS colors still look inverted, that tag is not being honored.
    log('prefers-color-scheme dark: ' +
      window.matchMedia('(prefers-color-scheme: dark)').matches);
    log('body classes: ' + document.body.className);

    // GPU identity, useful when something renders differently on one device.
    try {
      const gl = renderer.getContext();
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      if (info) {
        log('gl vendor: ' + gl.getParameter(info.UNMASKED_VENDOR_WEBGL));
        log('gl renderer: ' + gl.getParameter(info.UNMASKED_RENDERER_WEBGL));
      }
      log('gl version: ' + gl.getParameter(gl.VERSION));
      log('max texture size: ' + gl.getParameter(gl.MAX_TEXTURE_SIZE));
    } catch (err) {
      log('gl info unavailable: ' + err.message);
    }
    log('brand colour: ' + CONFIG.ui.brandColor +
      ' (icon glyphs ' + CONFIG.ui.iconColor + ', 5.4:1 contrast)');

    // What the edit screen will be able to do on this device.
    log('MediaRecorder: ' + (typeof window.MediaRecorder !== 'undefined'));
    log('canvas.captureStream: ' + (typeof editCanvas.captureStream === 'function'));
    log('getUserMedia: ' + !!(navigator.mediaDevices &&
      typeof navigator.mediaDevices.getUserMedia === 'function'));
    log('navigator.canShare: ' + (typeof navigator.canShare === 'function'));
    if (typeof window.MediaRecorder !== 'undefined' &&
        typeof MediaRecorder.isTypeSupported === 'function') {
      const supported = CONFIG.edit.videoTypes.filter((t) => MediaRecorder.isTypeSupported(t));
      log('supported video types: ' + (supported.length ? supported.join(' | ') : 'none'));
    }
    log('record cap: long side ' + CONFIG.edit.recordLongSide +
      ' px, ' + CONFIG.edit.recordFps + ' fps, max ' +
      CONFIG.edit.maxRecordSeconds + ' s');
    log('--- end diagnostics ---');
  }


  /* Reports the browser by name. Samsung Internet matters specifically: its
     dark mode rewrites CSS colours and ignores the color-scheme declaration,
     which is the whole reason the controls are painted on canvas. It must be
     checked before Chrome, because its user agent string contains Chrome too. */
  function browserName() {
    const ua = navigator.userAgent;
    const match = (re) => { const m = ua.match(re); return m ? m[1] : null; };

    let version = match(/SamsungBrowser\/([\d.]+)/);
    if (version) return 'Samsung Internet ' + version;
    version = match(/Edg(?:A|iOS)?\/([\d.]+)/);
    if (version) return 'Edge ' + version;
    version = match(/OPR\/([\d.]+)/);
    if (version) return 'Opera ' + version;
    version = match(/FxiOS\/([\d.]+)/) || match(/Firefox\/([\d.]+)/);
    if (version) return 'Firefox ' + version;
    version = match(/CriOS\/([\d.]+)/);
    if (version) return 'Chrome on iOS ' + version;
    version = match(/Chrome\/([\d.]+)/);
    if (version) return 'Chrome ' + version;
    version = match(/Version\/([\d.]+).*Safari/);
    if (version) return 'Safari ' + version;
    return 'unrecognised';
  }

  function forcesDarkColors() {
    return /SamsungBrowser\//.test(navigator.userAgent);
  }

  // three.js tone mapping constants are numbers; this turns one into a name.
  function toneMappingName(value) {
    const names = {};
    names[THREE.NoToneMapping] = 'NoToneMapping';
    names[THREE.LinearToneMapping] = 'LinearToneMapping';
    names[THREE.ReinhardToneMapping] = 'ReinhardToneMapping';
    names[THREE.CineonToneMapping] = 'CineonToneMapping';
    names[THREE.ACESFilmicToneMapping] = 'ACESFilmicToneMapping';
    if (THREE.AgXToneMapping !== undefined) names[THREE.AgXToneMapping] = 'AgXToneMapping';
    if (THREE.NeutralToneMapping !== undefined) names[THREE.NeutralToneMapping] = 'NeutralToneMapping';
    return names[value] !== undefined ? names[value] : 'unknown (' + value + ')';
  }

  buildEnvironment();

  // applyMaterial pulls in the material's own default background. The only
  // exception is a link that named a background explicitly, which is then
  // applied on its own afterwards.
  applyMaterial(materialKey, !backgroundExplicit);
  if (backgroundExplicit) applyBackground(backgroundKey);

  showScreen('main');
  repaintUi();            // first paint of every control
  logDiagnostics();

  /* Started before the model request and deliberately not awaited, so the two
     run in parallel. The only way this interrupts anything is by reloading. */
  checkForNewVersion(VIEWER_VERSION, function (line) { log(line); });

  if (!modelId) {
    log('No model parameter in the URL.', 'err');
    showError(MESSAGES.noModel);
  } else if (!apiKey) {
    log('No k (API key) parameter in the URL.', 'err');
    showError(MESSAGES.failed);
  } else {
    log('Model: ' + modelId + ', key: ' + maskKey(apiKey) + ', material: ' + materialKey +
      ', background: ' + backgroundKey);
    loadModel();
  }
</script>
</body>
</html>
